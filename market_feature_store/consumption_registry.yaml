# ============================================================================
# 数据消费 registry —— identity / value 分层的单一事实源
# ============================================================================
# 原则：同一张表可以一半慢、一半快。慢的是「谁在名单里」(identity)，
# 快的是「这些人今天多少钱」(value)。刷新策略按 identity 定，值按最便宜的源取。
#
# 三个消费者：
#   1. 同步管线 skills/daily-full-review/scripts/run_review_sync.py --plan full|cheap|auto
#      —— 本文件 `plans` 段与 build_plan() 的步骤名一致性由
#         tests/test_consumption_registry.py 强制（漂了测试就红）。
#   2. agent 查询层（intelligence/services/finance_query.py 的 _DATASETS 管「有哪些字段」，
#      本文件管「多久刷、从哪拿、怎么联立、何时主动」）。
#   3. 人。改抓取策略 = 改这里 + 改 run_review_sync.build_plan，测试会拦住漂移。
#
# 纪律（沿用 _DATASETS 的约定）：只写**性质**与**带日期的证据**，不写会漂的行数。
# 证据标注：
#   [用户实测] = 77 的 Jaccard 度量（相邻交易日集合重叠，窗口 2026-08-24 ~ 09-02）
#   [回测]     = 2026-09-04 快照库回测（/tmp/mfs-analysis，7 交易日 × 403 板块）
#   [接手复核] = 2026-09-04 接手 agent 在同一快照上的补充度量
#
# 请求计数口径（重要）：按 fupanhui **HTTP 请求**数计，不按 CDP eval 数计。
# 批量抓取在 JS 里仍是逐板块 fetch，所以「一个 chunk」= 8~12 个请求。
# ============================================================================

meta:
  updated: "2026-09-04"
  evidence_window: "2026-08-24 ~ 2026-09-02"
  quota_note: >-
    fupanhui 有周/月调用上限(429)，具体数字未公开。
    full 计划 ≈ 成分 403 + 板块K线 403 + 龙虎榜席位 45~105 + 研报目录 ≤20 + 其余单请求 ~25
    ≈ 900~950 请求/日。
    cheap 计划 ≈ 宇宙 1 + 成分 delta 0~15 + 板块 0(本地) + 涨停热度 ~5 + 新高 ~4 + 连板 1
    + 主线 3 + 题材资金 1 + 市场总览 ~3 + 公开资产 ~10(席位走 akshare、研报增量 1 页、竞价停)
    ≈ 30~45 请求/日；周五 full 一次兜换血盲区。

tiers:
  A-replace:  "客观快变量：停打复盘会，用东财/akshare/本地公式。值与复盘会同源可验。"
  B-identity: "慢 identity：每日 1 请求探针(宇宙自带成分数)，谁变刷谁；周五全量兜换血盲区。"
  C-daily:    "复盘会独有的产品判断/口径：便宜日更（每步 1~5 请求）。"
  D-derived:  "本地派生：不发任何请求，从 fact 表计算。"

# ============================================================================
# 管线计划（机器可读；与 run_review_sync.build_plan 一一对应）
# infrastructure 步骤不归属任何数据族。
# ============================================================================
plans:
  infrastructure_steps: [db-lock, features]
  full:
    - db-lock
    - sectors
    - market-overview
    - index-daily
    - sw-l1-daily
    - market-deviation
    - sector-daily
    - sector-stocks
    - limit-heat
    - stock-high
    - limit-advance
    - stock-daily
    - mainline-daily
    - mainline-sector-daily
    - theme-flow-daily
    - public-assets
    - features
  # cheap 的顺序有依赖：stock-daily / stock-high / limit-heat 必须在 stitch 之前
  # （拼接行的 price/pct/amount、high_status、limit_times 都从它们 join）。
  cheap:
    - db-lock
    - sectors
    - market-overview
    - index-daily
    - sw-l1-daily
    - market-deviation
    - stock-daily
    - stock-high
    - limit-heat
    - stitch-sector-stocks
    - sector-stocks-delta
    - sector-daily-local
    - limit-advance
    - mainline-daily
    - mainline-sector-daily
    - theme-flow-daily
    - public-assets
    - features
  # local（2026-09-07 起）：不发任何 fupanhui 请求。名单冻结在最后一份 published 宇宙
  # （carry-forward-universe → stitch），加工层按公开规则自算（limit-stats-local / market-overview-local）。
  # 不产 mainline / theme_flow / stock_high / 公开资产——门禁按 tables_for_plan('local') 裁剪。
  local:
    - db-lock
    - stock-daily
    - index-daily
    - sw-l1-daily
    - carry-forward-universe
    - stitch-sector-stocks
    - sector-daily-local
    - limit-stats-local
    - market-overview-local
    - market-editorial-local
    - market-stage-local
    - stock-high-local
    - mainline-local
    - core-stock-local
    - core-leader-local
    - features

# ============================================================================
# 数据族层
# ============================================================================
datasets:

  - key: sector_universe
    label: 板块宇宙 (990.FP)
    tables: [dim_sector, fact_sector_universe_daily, ops_sector_universe_snapshot_daily, ops_sector_search_payload_daily]
    endpoint: /reviews/sectors/search
    steps: {full: [sectors], cheap: [sectors], local: [carry-forward-universe]}
    identity:
      what: 板块代码集合（活宇宙只有 990.FP）
      cadence: 极慢
      evidence: "09-01→09-02 403/403 完全相同，Jaccard=1.0 [用户实测]；08-20~09-02 九个相邻日零新增零消失 [接手复核]"
    value:
      what: expected_stock_count（成分数声明）、payload 随行情字段（pct_chg/strength 等，字段集合待首次实测落库 raw_json 后确认）
      cadence: 极快
      evidence: "expected_stock_count 日变动 0~15 个板块，中位≈6 [回测][接手复核]"
    refresh:
      tier: B-identity
      policy: >-
        每日 1 请求照常发布快照。这个请求同时是三件事：成分 delta 探针（expected 变了的板块
        才打复盘会）、板块日行情官方涨幅来源（payload 落 ops_sector_search_payload_daily）、
        宇宙本身。publish_snapshot 自带 95% 名称连续性门。
    pitfalls:
      - "同花顺 885 替不了 990；.TI 是死码（223 个，7-24 后退役），别再抓"
      - "dim_sector 是全历史口径，含 is_active=false 死行，抓取清单必须按当日宇宙过滤"

  - key: sector_members
    label: 板块成分（谁在哪个题材里）
    tables: [fact_sector_stock_daily, ops_sector_member_sync_daily]
    endpoint: /reviews/sector-cycle/{ts}/stocks
    steps: {full: [sector-stocks], cheap: [stitch-sector-stocks, sector-stocks-delta], local: [stitch-sector-stocks]}
    identity:
      what: sector→stock 归属关系
      cadence: 极慢
      evidence: >-
        5 日 Jaccard 0.999 [用户实测]。expected 不变的板块里每天仍有 5~63 个名单微动
        （多为 1~2 只，合计 30~80 只/日 ÷ 5.28 万条关系），量级落在明细接口
        「每只成员约 0.25% 独立概率不出现」的既知噪声带内（见 sector_universe.py
        MEMBER_SHORTFALL_MAX_RATIO 注释），不是真换血 [接手复核]
    value:
      what: 价、涨幅、成交额、N日涨幅、资金流、市值
      cadence: 极快
      evidence: "09-01→09-02 对齐 52816 行：涨幅变 99.4%、成交额变 98.9% [用户实测]"
    refresh:
      tier: B-identity
      policy: >-
        cheap 日：stitch-sector-stocks —— expected 数没变的板块 = 该板块最近一次
        source='fupanhui' 的名单（identity 基线） × 当日东财真值，走
        SectorUniverseStore.record_member_result 公开 API，source='local:stitch'；
        expected 变了 / 新板块 / 缺口超界的留 pending，随后 sector-stocks-delta 只打这些。
        周五 full：sector-stocks 全量重拉，兜『一进一出数量不变』的换血盲区（最坏陈旧 5 个交易日）。
        基线取最近一次 fupanhui 名单而非昨日拼接行：停牌一天的股票复牌后自动回来，不会被链式丢掉。
    stitch_fill:  # 拼接行各字段的填法与依据
      price_pct_amount: "东财 fact_stock_daily(source='eastmoney:snapshot')，与复盘会逐只完全一致（p99 差=0.0）[回测]；源为 fallback 的日子拒绝拼接（循环）"
      dropped_members: "东财无当日值的成员（停牌/退市）剔除，不留 NULL——门禁 _check_sector_stock_fields 不容 NULL；09-02 实测 402/403 板块缺口在界内，缺值全部是同一只已退市 ST [接手复核]"
      pct_chg_3d_5d: "本地 LAG 复算，p99 误差 0.005pp [回测]"
      pct_chg_10d_20d: "本地复算，p99 0.5/1.4pp（不复权 vs 前复权的分红除权尾巴）[回测]"
      high_status: "当日 fact_stock_high_daily.primary_high_period/label JOIN，取值体系同一套 [回测][接手复核]"
      limit_times: "当日 fact_theme_limit_stock_daily.limit_times JOIN（取 MAX）"
      mcap: "float/total 走腾讯 qt.gtimg.cn 现值（非复盘会源，沿用原同步器）；失败退回按 close 比例缩放基线，mcap_source='local:scaled'；circ_mv 只能缩放"
      fund_flow_1d_5d: "留 NULL——复盘会独有口径；东财主力净流入等价性未验证。周五全量补齐"
      identity_labels: "stock_name/sw_industry/leader_plate/leader_sub_plate/role_tags 随基线 carry"
    pitfalls:
      - "被禁的 fast_daily_sync.py 教训：拷旧行改日期、值全空 = 静默降级；拼接必须填真值 + source 标记"
      - "这是原 daily-full 请求量最大的一步（403 请求/日），降频收益最大"

  - key: sector_daily
    label: 板块日行情 + 边际量
    tables: [fact_sector_daily]
    endpoint: "/reviews/sector-cycle/{ts}/kline（full）→ sectors/search payload + 本地聚合（cheap）"
    steps: {full: [sector-daily], cheap: [sector-daily-local], local: [sector-daily-local]}
    identity: {what: 与宇宙同, cadence: 极慢, evidence: 同 sector_universe}
    value:
      what: pct_chg / amount / diff_ratio / strength
      cadence: 极快
      evidence: "403 板块成交额 403/403 日日变、涨幅 402/403 变，金额日环比中位≈14% [用户实测]"
    refresh:
      tier: D-derived
      policy: >-
        cheap 日：sector-daily-local —— 成交额 = 成分求和；边际量 = (今额-昨额)/昨额×100；
        涨幅优先取 sectors/search payload 官方值，缺则成分等权；走 replace_sector_daily。
        新板块无昨额时用「今日成分 × 昨日东财额」代理。每周 reconcile-sector-daily 抽样对账。
    formulas:
      amount: "SUM(成分 amount)，相对误差中位 0.001%、p95<0.2% [回测]；单位三表同为亿 [接手复核]"
      diff_ratio: "(今日额−昨日额)/昨日额×100，误差中位 0.003pp [回测]（用户已验 403/403 贴合）"
      pct_chg: >-
        题材类=成分等权（54% 板块-日误差<0.01pp）；申万行业类是指数口径，等权 p95 偏差~1pp、
        符号不一致 164/2821 —— 所以优先 payload 官方值 [回测]。09-02 单日等权符号不一致 14/403，
        但严格双红判定零翻转 [接手复核]
    pitfalls:
      - "strength 全库空着，主路径没用"
      - "能算 ≠ 和他们一样：分母永远是 990.FP 成分，不是自选股票池"
      - "Kline API diff_ratio 偶发全零（历史已知），本地公式天然免疫"

  - key: stock_daily
    label: 全 A 个股日线
    tables: [fact_stock_daily]
    steps: {full: [stock-daily], cheap: [stock-daily], local: [stock-daily]}
    identity: {what: 全A股票宇宙, cadence: 慢}
    value: {what: 收盘/涨幅/成交额, cadence: 极快}
    refresh:
      tier: A-replace
      policy: >-
        已是东财快照（sync-stock-daily-snapshot，非复盘会）。维持。失败兜底 fill-stock-daily-fallback
        （source 带 fallback，来自成分表——cheap 日拼接器会拒绝这种源）。历史回填走 mootdx。
    evidence: "东财值与复盘会成分表逐只完全一致（价/涨幅/成交额 p99 差=0.0）[回测]"

  - key: market_overview
    label: 市场总览（要拆开看）
    tables: [fact_market_daily]
    endpoint: /reviews/market + /summary + /cycle
    steps: {full: [market-overview, market-deviation], cheap: [market-overview, market-deviation], local: [market-overview-local, market-editorial-local, market-stage-local]}
    identity:
      what: market_stage 阶段名
      cadence: 偏慢
      evidence: "「底部横盘」可连持十几天（stage_day 到 19、25~26）[用户实测]"
    value:
      what: stage_day(+1/日)、冰点、涨停家数、AI摘要 note、成交额、涨跌家
      cadence: 快
      evidence: "冰点等级、摘要每天重写 [用户实测]"
    refresh:
      tier: C-daily
      policy: "保留复盘会（阶段/冰点/摘要是编辑判断，独有价值），~3 请求。成交额/涨跌家等客观量已有 akshare 上证交叉验证。周均线/偏离度走 CDP 页面 hover，失效时 MA5 本地复算兜底。"

  - key: index_and_sw_l1
    label: 上证指数 / 申万一级
    tables: [fact_sw_l1_daily]
    steps: {full: [index-daily, sw-l1-daily], cheap: [index-daily, sw-l1-daily], local: [index-daily, sw-l1-daily]}
    refresh: {tier: A-replace, policy: "已是 akshare（非复盘会）。维持。"}

  - key: mainline
    label: 主线题材 / 主线股 / 主线板块
    tables: [fact_mainline_theme_daily, fact_mainline_stock_daily, fact_mainline_sector_daily]
    steps: {full: [mainline-daily, mainline-sector-daily], cheap: [mainline-daily, mainline-sector-daily], local: [mainline-local]}
    identity:
      what: 主线题材代码 TH*.FP
      cadence: 偏慢
      evidence: "相邻日常是 5 个完全一样，8 天换 1 个 [用户实测]"
    value:
      what: 主线股池 / 板块强度
      cadence: 快
      evidence: "主线成分股 J=0.88，主线对应板块 J=0.77 [用户实测]"
    refresh:
      tier: C-daily
      policy: "每天拉（各 1 请求、几条~几十条）。主题列表慢但股池快，不能像成分那样降频。"
    pitfalls: ["mainline_sector_daily 是当日主线的十余行子集，不是全量榜——分母陷阱已写进 _DATASETS"]

  - key: limit_heat
    label: 涨停热度（题材归属）
    tables: [fact_theme_limit_heat_daily, fact_theme_limit_stock_daily]
    steps: {full: [limit-heat], cheap: [limit-heat], local: [limit-stats-local]}
    identity:
      what: 哪些题材上榜
      cadence: 快
      evidence: "J=0.53 [用户实测]"
    value: {what: 涨停家数/市占/明细, cadence: 极快}
    refresh:
      tier: C-daily
      policy: "保留（题材归属绑在 990.FP 上是独有价值；明细供 stitch 的 limit_times join 和同日门禁，chunk 化 ~5 请求）。"

  - key: stock_high
    label: 新高个股
    tables: [fact_stock_high_daily]
    steps: {full: [stock-high], cheap: [stock-high], local: [stock-high-local]}
    identity: {what: 新高集合, cadence: 快, evidence: "J=0.32（1243 vs 768），口径还漂 [用户实测]"}
    value: {what: 价格/映射, cadence: 极快}
    refresh:
      tier: C-daily
      policy: "暂留复盘会（~4 页请求，whitelist_sectors 映射到 990.FP 是独有的；供 stitch 的 high_status join）。候选换源：东财创新高榜（口径会漂，换前先 diff）。"

  - key: limit_advance
    label: 连板晋级梯队
    tables: [fact_limit_advance_daily]
    steps: {full: [limit-advance], cheap: [limit-advance], local: [limit-stats-local]}
    identity: {what: 梯队名单, cadence: 快, evidence: "J=0.24，龙头高度日更 [用户实测]"}
    value: {what: boards/晋级率, cadence: 极快}
    refresh: {tier: C-daily, policy: "每天 1 请求，便宜。"}

  - key: theme_flow
    label: 题材资金面板
    tables: [fact_theme_flow_daily]
    steps: {full: [theme-flow-daily], cheap: [theme-flow-daily]}
    identity: {what: 面板覆盖题材, cadence: 中速, evidence: "J=0.80 [用户实测]"}
    value: {what: 资金流, cadence: 极快}
    refresh: {tier: C-daily, policy: "每天 1 请求。"}

  # ---- 公开资产（public-assets 一步之内的子任务，按 plan 分档）----

  - key: core_stocks
    label: 核心股 TOP50
    tables: [fact_core_stock_daily]
    steps: {full: [public-assets], cheap: [public-assets], local: [core-stock-local]}
    identity:
      what: 名单本身
      cadence: 快（名字像名单，实测是快变量）
      evidence: "J=0.54~0.64，每天进出约 14 只 [用户实测]"
    value: {what: 排名/行情, cadence: 极快}
    refresh:
      tier: D-derived
      policy: >-
        2026-09-07 反推：这个『核心』既不是编辑判断也不是涨幅榜，就是**当日成交额前 50**
        （405 日 20250 行，集合命中 99.5%，rank 与 amount 降序一致 99.98%）。local 档自算，
        不再需要请求；full/cheap 仍走 public-assets 拿 fund_flow_today（唯一自算不了的字段）。

  - key: core_leaders
    label: 核心个股（自家：主线 × 正宗 × 人气）
    tables: [fact_core_leader_daily]
    steps: {local: [core-leader-local]}
    identity:
      what: 主线题材成员池
      cadence: 跟随 mainline
      evidence: "池 = 当日主线板块成分股 [实测]"
    value: {what: 正宗度 × 人气排序, cadence: 极快}
    refresh:
      tier: D-derived
      policy: >-
        纯本地派生：行情来自 fact_stock_daily / fact_stock_high_daily，正宗度来自知识库
        entity_exposures（无网络）。与 core_stocks 是两个口径，不混表。

  - key: regulation
    label: 监管事件 / 监管池
    tables: [fact_regulation_event_daily, fact_regulation_pool_daily]
    steps: {full: [public-assets], cheap: [public-assets]}
    identity:
      what: 名单
      cadence: "事件偏慢(J=0.90)、池子快(J=0.27~0.43)——池看起来像名单，实际隔日换一半"
      evidence: "[用户实测]"
    value: {what: 当日状态, cadence: 快}
    refresh: {tier: C-daily, policy: "每天 2 请求，很便宜，产品规则独有。"}

  - key: dragon
    label: 龙虎榜（榜单/汇总/席位）
    tables: [fact_dragon_tiger_daily, fact_dragon_summary_daily, fact_dragon_seat_daily]
    steps: {full: [public-assets], cheap: [public-assets]}
    identity: {what: 上榜个股, cadence: 极快, evidence: "J=0.08（20 只重叠 3 只），交易所当日披露 [用户实测]"}
    value: {what: 席位买卖额, cadence: 当日一次性}
    refresh:
      tier: A-replace
      policy: >-
        榜单+汇总留复盘会（各 1 请求）；席位明细（45~105 请求/日，第二大配额消耗）cheap 日换
        akshare 东财 LHB 个股详情（交易所公开数据同源；2026-09-04 实测 002536 三席位金额/占比
        逐项对上，单位 元→亿、比例→%）；东财失败或零行自动回退复盘会保门禁绿。
        seat_type/hm_name 是复盘会增值标注：东财路径按席位名启发式补 seat_type
        （机构专用→机构，*股通→游资且 hm_name=席位名，其余→营业部），其余 hm_name 留 NULL。
    pitfalls: ["fact_dragon_seat_daily 在 GAP_TABLES 里，cheap 日也必须有行——所以是换源不是停抓"]

  - key: auction
