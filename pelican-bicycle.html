<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行记 · Pelican Rider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
    background: linear-gradient(160deg, #1e3a5f 0%, #2d5f8a 55%, #3d7ab5 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  .card {
    width: min(96vw, 960px);
    background: #fff;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  svg { width: 100%; height: auto; display: block; border-radius: 12px; }
  .caption { color: #dceafc; font-size: 14px; letter-spacing: .12em; opacity: .85; }

  /* ---- CSS animations (SVG-internal motion) ---- */
  .cloud  { animation: drift linear infinite; }
  .cloud1 { animation-duration: 34s; animation-delay: -6s; }
  .cloud2 { animation-duration: 46s; animation-delay: -28s; }
  .cloud3 { animation-duration: 40s; animation-delay: -18s; }
  @keyframes drift {
    from { transform: translateX(960px); }
    to   { transform: translateX(-260px); }
  }
  .dashline { animation: dashmove .5s linear infinite; }
  @keyframes dashmove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 68; } }
  .speed { animation: zoom 1s linear infinite; opacity: 0; }
  .speed2 { animation-delay: .35s; }
  .speed3 { animation-delay: .65s; }
  @keyframes zoom {
    0%   { transform: translateX(0);     opacity: 0; }
    12%  { opacity: .85; }
    100% { transform: translateX(-150px); opacity: 0; }
  }
  .bob { animation: bob .9s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  .fish { transform-box: fill-box; transform-origin: 20% 60%; animation: wiggle 1.1s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
</style>
</head>
<body>
  <div class="card">
  <svg viewBox="0 0 900 600" role="img" aria-label="一只戴头盔的鹈鹕骑着自行车，篮子里还有一条鱼">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#aedcf7"/>
        <stop offset="0.65" stop-color="#dff3fd"/>
        <stop offset="1" stop-color="#f3faef"/>
      </linearGradient>
    </defs>

    <!-- ======== 背景 background ======== -->
    <rect width="900" height="600" fill="url(#sky)"/>
    <circle cx="118" cy="112" r="58" fill="#ffd76e" opacity=".35"/>
    <circle cx="118" cy="112" r="40" fill="#ffcf5c"/>

    <!-- clouds -->
    <g class="cloud cloud1" opacity=".95">
      <ellipse cx="0" cy="120" rx="46" ry="18" fill="#fff"/>
      <ellipse cx="34" cy="110" rx="30" ry="15" fill="#fff"/>
      <ellipse cx="-32" cy="112" rx="26" ry="13" fill="#fff"/>
    </g>
    <g class="cloud cloud2" opacity=".8">
      <ellipse cx="0" cy="210" rx="56" ry="20" fill="#fff"/>
      <ellipse cx="40" cy="200" rx="32" ry="16" fill="#fff"/>
    </g>
    <g class="cloud cloud3" opacity=".7">
      <ellipse cx="0" cy="70" rx="38" ry="14" fill="#fff"/>
      <ellipse cx="26" cy="62" rx="24" ry="12" fill="#fff"/>
    </g>

    <!-- hills + ground + road -->
    <ellipse cx="190" cy="560" rx="300" ry="90" fill="#cfe8bd"/>
    <ellipse cx="680" cy="572" rx="360" ry="104" fill="#bfe0ab"/>
    <rect x="0" y="506" width="900" height="12" fill="#9cc177"/>
    <rect x="0" y="512" width="900" height="88" fill="#8b9099"/>
    <rect x="0" y="512" width="900" height="5" fill="#767b84"/>
    <line class="dashline" x1="0" y1="556" x2="900" y2="556"
          stroke="#f6f2e2" stroke-width="6" stroke-dasharray="40 28"/>

    <!-- speed lines -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9">
      <line class="speed"       x1="150" y1="196" x2="222" y2="196"/>
      <line class="speed speed2" x1="120" y1="238" x2="210" y2="238"/>
      <line class="speed speed3" x1="150" y1="280" x2="230" y2="280"/>
    </g>

    <!-- shadow under bike -->
    <ellipse cx="452" cy="516" rx="250" ry="11" fill="#000" opacity=".14"/>

    <!-- ======== 远侧腿 far leg (behind frame) ======== -->
    <polyline points="392.0,284.0 454.0,349.2 396.0,418.0" fill="none" stroke="#c97a17" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="points" dur="1.8s" repeatCount="indefinite"
               values="392.0,284.0 454.0,349.2 396.0,418.0;392.0,284.0 470.1,328.8 406.5,392.5;392.0,284.0 479.4,305.5 432.0,382.0;392.0,284.0 479.4,305.3 457.5,392.5;392.0,284.0 470.5,328.0 468.0,418.0;392.0,284.0 448.7,353.9 457.5,443.5;392.0,284.0 433.2,364.0 432.0,454.0;392.0,284.0 440.2,360.0 406.5,443.5;392.0,284.0 454.0,349.2 396.0,418.0"/>
    </polyline>

    <!-- ======== 车轮 wheels ======== -->
    <g stroke="#3a3f47">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 280 420" to="360 280 420" dur="0.9s" repeatCount="indefinite"/>
        <circle cx="280" cy="420" r="88" fill="none" stroke-width="11"/>
        <circle cx="280" cy="420" r="76" fill="none" stroke="#aab2bd" stroke-width="4"/>
        <g stroke="#aab2bd" stroke-width="4">
          <line x1="280" y1="336" x2="280" y2="504"/>
          <line x1="196" y1="420" x2="364" y2="420"/>
          <line x1="221" y1="361" x2="339" y2="479"/>
          <line x1="339" y1="361" x2="221" y2="479"/>
        </g>
        <circle cx="280" cy="420" r="9" fill="#3a3f47" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 622 420" to="360 622 420" dur="0.9s" repeatCount="indefinite"/>
        <circle cx="622" cy="420" r="88" fill="none" stroke-width="11"/>
        <circle cx="622" cy="420" r="76" fill="none" stroke="#aab2bd" stroke-width="4"/>
        <g stroke="#aab2bd" stroke-width="4">
          <line x1="622" y1="336" x2="622" y2="504"/>
          <line x1="538" y1="420" x2="706" y2="420"/>
          <line x1="583" y1="361" x2="661" y2="479"/>
          <line x1="661" y1="361" x2="583" y2="479"/>
        </g>
        <circle cx="622" cy="420" r="9" fill="#3a3f47" stroke="none"/>
      </g>
    </g>

    <!-- ======== 车架 frame ======== -->
    <g fill="none" stroke="#e0524f" stroke-width="10" stroke-linecap="round">
      <line x1="432" y1="418" x2="378" y2="308"/>            <!-- seat tube -->
      <line x1="378" y1="312" x2="568" y2="314"/>            <!-- top tube -->
      <line x1="574" y1="340" x2="432" y2="418"/>            <!-- down tube -->
      <line x1="280" y1="420" x2="432" y2="418"/>            <!-- chainstay -->
      <line x1="280" y1="420" x2="376" y2="306"/>            <!-- seatstay -->
      <line x1="566" y1="308" x2="580" y2="352"/>            <!-- head tube -->
      <line x1="580" y1="352" x2="622" y2="420"/>            <!-- fork -->
    </g>
    <!-- handlebar -->
    <path d="M 566 310 L 558 286 Q 554 274 544 276" fill="none"
          stroke="#3a3f47" stroke-width="8" stroke-linecap="round"/>
    <circle cx="544" cy="276" r="6" fill="#3a3f47"/>
    <!-- chain + cog + chainring -->
    <circle cx="280" cy="420" r="13" fill="none" stroke="#4a4f57" stroke-width="5"/>
    <circle cx="432" cy="418" r="21" fill="none" stroke="#4a4f57" stroke-width="6"/>
    <line x1="280" y1="406" x2="432" y2="397" stroke="#5b6068" stroke-width="4" stroke-dasharray="6 3"/>
    <line x1="280" y1="434" x2="432" y2="439" stroke="#5b6068" stroke-width="4" stroke-dasharray="6 3"/>
    <!-- saddle -->
    <path d="M 348 300 Q 348 292 362 292 L 394 292 Q 404 292 400 301 Z" fill="#3a3f47"/>

    <!-- ======== 曲柄 + 脚踏 crank & pedals ======== -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 432 418" to="360 432 418" dur="1.8s" repeatCount="indefinite"/>
      <line x1="396" y1="418" x2="468" y2="418" stroke="#2f333b"
            stroke-width="9" stroke-linecap="round"/>
      <!-- pedal A (near foot) -->
      <g transform="translate(468 418)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="-360 0 0" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-15" y="-1" width="30" height="9" rx="2.5" fill="#2f333b"/>
          <path d="M -5 -4 L 17 -4 Q 24 -3 17 1 L -5 1 Q -9 -1.5 -5 -4 Z" fill="#f5a028"/>
        </g>
      </g>
      <!-- pedal B (far foot) -->
      <g transform="translate(396 418)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="-360 0 0" dur="1.8s" repeatCount="indefinite"/>
          <rect x="-15" y="-1" width="30" height="9" rx="2.5" fill="#2f333b"/>
          <path d="M -5 -4 L 17 -4 Q 24 -3 17 1 L -5 1 Q -9 -1.5 -5 -4 Z" fill="#c97a17"/>
        </g>
      </g>
    </g>

    <!-- ======== 鹈鹕 pelican ======== -->
    <g class="bob">
      <!-- tail feathers -->
      <g stroke="#d8d2c4" stroke-width="2">
        <path d="M 340 240 L 302 224 L 336 232 L 298 244 L 338 246 L 306 262 Z" fill="#efe9db"/>
      </g>
      <!-- body -->
      <ellipse cx="398" cy="238" rx="78" ry="52" fill="#f7f3ec" stroke="#d8d2c4" stroke-width="3"/>
      <!-- folded wing -->
      <path d="M 372 214 Q 430 218 452 252 Q 420 272 372 262 Q 352 240 372 214 Z"
            fill="#e9e3d4" stroke="#d8d2c4" stroke-width="2"/>
      <!-- scarf -->
      <path stroke="#e0524f" stroke-width="11" stroke-linecap="round" fill="none"
            d="M 452 192 C 420 180 390 195 362 178">
        <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
          values="M 452 192 C 420 180 390 195 362 178;
                  M 452 192 C 420 170 392 202 364 184;
                  M 452 192 C 420 180 390 195 362 178"/>
      </path>
      <circle cx="455" cy="192" r="8" fill="#e0524f"/>
      <!-- neck (double stroke: outline + fill) -->
      <path d="M 448 212 C 474 206 484 178 480 152 C 477 132 486 118 502 114"
            fill="none" stroke="#d8d2c4" stroke-width="32" stroke-linecap="round"/>
      <path d="M 448 212 C 474 206 484 178 480 152 C 477 132 486 118 502 114"
            fill="none" stroke="#f7f3ec" stroke-width="26" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="508" cy="116" r="23" fill="#f7f3ec" stroke="#d8d2c4" stroke-width="3"/>
      <!-- helmet -->
      <path d="M 484 104 Q 508 68 532 104 Q 508 92 484 104 Z" fill="#e0524f" stroke="#c2423f" stroke-width="2"/>
      <path d="M 496 80 Q 508 74 520 80" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      <line x1="487" y1="106" x2="497" y2="126" stroke="#c2423f" stroke-width="3"/>
      <!-- beak: upper + pouch -->
      <path d="M 519 106 L 662 124 Q 674 127 664 133 L 520 122 Z"
            fill="#efa12f" stroke="#d68a1f" stroke-width="2"/>
      <path d="M 517 122 Q 526 178 588 172 Q 642 165 658 132 L 520 120 Z"
            fill="#f6bd55" stroke="#d68a1f" stroke-width="2"/>
      <line x1="528" y1="128" x2="636" y2="133" stroke="#d68a1f" stroke-width="1.5" opacity=".6"/>
      <!-- eye -->
      <circle cx="513" cy="109" r="4" fill="#2b2f36"/>
      <circle cx="514.4" cy="107.6" r="1.4" fill="#fff"/>
      <!-- wing-arm to handlebar -->
      <path d="M 448 240 Q 502 248 548 274" fill="none" stroke="#d8d2c4" stroke-width="21" stroke-linecap="round"/>
      <path d="M 448 240 Q 502 248 548 274" fill="none" stroke="#f7f3ec" stroke-width="15" stroke-linecap="round"/>
      <g stroke="#d8d2c4" stroke-width="2">
        <line x1="536" y1="272" x2="546" y2="262"/>
        <line x1="540" y1="276" x2="551" y2="267"/>
      </g>
    </g>

    <!-- ======== 近侧腿 near leg (in front of body) ======== -->
    <polyline points="400.0,282.0 477.1,328.5 468.0,418.0" fill="none" stroke="#f5a028" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="points" dur="1.8s" repeatCount="indefinite"
               values="400.0,282.0 477.1,328.5 468.0,418.0;400.0,282.0 454.7,353.5 457.5,443.5;400.0,282.0 436.8,364.1 432.0,454.0;400.0,282.0 442.9,361.1 406.5,443.5;400.0,282.0 456.9,351.7 396.0,418.0;400.0,282.0 474.1,333.1 406.5,392.5;400.0,282.0 485.6,309.7 432.0,382.0;400.0,282.0 486.4,307.3 457.5,392.5;400.0,282.0 477.1,328.5 468.0,418.0"/>
    </polyline>

    <!-- ======== 车筐 + 鱼 basket & fish ======== -->
    <g>
      <path d="M 588 258 L 596 300 L 646 300 L 654 258 Z" fill="#c98a4b" stroke="#a06b34" stroke-width="3"/>
      <path d="M 588 258 L 654 258" stroke="#a06b34" stroke-width="3"/>
      <path d="M 594 272 L 650 272 M 597 286 L 647 286" stroke="#a06b34" stroke-width="2" opacity=".7"/>
      <path d="M 596 258 L 604 300 M 612 258 L 614 300 M 630 258 L 626 300 M 646 258 L 638 300"
            stroke="#a06b34" stroke-width="2" opacity=".5"/>
      <g class="fish">
        <ellipse cx="618" cy="246" rx="20" ry="9" fill="#7fb8d8" stroke="#5a94b8" stroke-width="2"/>
        <path d="M 636 246 L 648 238 L 648 254 Z" fill="#7fb8d8" stroke="#5a94b8" stroke-width="2"/>
        <circle cx="608" cy="244" r="2" fill="#2b2f36"/>
      </g>
      <line x1="596" y1="258" x2="576" y2="280" stroke="#a06b34" stroke-width="3"/>
    </g>

    <!-- ======== 标题 title ======== -->
    <text x="450" y="48" text-anchor="middle" font-size="34" font-weight="800"
          fill="#2c3e50" letter-spacing="4">🚲 鹈鹕骑行记</text>
    <text x="450" y="590" text-anchor="middle" font-size="15"
          fill="#f6f2e2" letter-spacing="6" opacity=".85">— PEDAL ON, PELICAN —</text>
  </svg>
  </div>
  <p class="caption">一只戴头盔的鹈鹕 · 一辆单车 · 篮里还有今日份的鱼 🐟</p>
</body>
</html>
