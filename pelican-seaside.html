<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="description" content="一只鹈鹕，一辆单车，一个不用着急的下午。可离线打开的互动矢量小画。">
  <title>慢慢骑 · 鹈鹕的海风假日</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f1e7;
      --ink: #244a43;
      --muted: #758178;
      --line: #d8ddd0;
      --sky: #e8eee0;
      --sea: #a8ccc3;
      --sea-deep: #8fbbb2;
      --sea-line: #e5efe2;
      --sand: #e4ddbf;
      --road: #ede6d5;
      --sun: #edb95a;
      --white: #fffcf1;
      --coral: #d97355;
      --bike: #479e92;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color 900ms ease;
      -webkit-font-smoothing: antialiased;
    }
    body[data-scene="sunset"] {
      --paper: #f3e5d7;
      --sky: #eed8c4;
      --sea: #9cb9b7;
      --sea-deep: #85a8a7;
      --sea-line: #dfded0;
      --sand: #dfc9a5;
      --road: #ead8be;
      --sun: #dc8054;
      --line: #d7cbbc;
    }
    button { font: inherit; }
    button:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 5px;
    }
    button { -webkit-tap-highlight-color: transparent; }
    .page { width: min(1280px, calc(100% - 96px)); margin: auto; }
    .masthead {
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 44px; height: 44px; }
    .brand-name { font-size: 20px; font-weight: 750; letter-spacing: .08em; }
    .brand-english { margin-top: 4px; font-size: 9px; letter-spacing: .19em; }
    .weather { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .09em; }
    .weather svg { width: 19px; height: 19px; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 40px 0 0; }
    .eyebrow { margin: 0 0 16px; font-size: 10px; letter-spacing: .22em; font-weight: 650; }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      font-size: clamp(34px, 4.7vw, 67px);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: 1.2;
    }
    h1 .dot { color: var(--coral); }
    .intro-note { margin: 0 5px 5px 0; font-size: 12px; line-height: 2; letter-spacing: .06em; color: #66786c; }
    .illustration { position: relative; margin: -7px -24px 0; }
    .landscape { display: block; width: 100%; height: auto; overflow: visible; }
    .landscape .palette { transition: fill 900ms ease, stroke 900ms ease; }
    .caption { position: absolute; bottom: 5.8%; left: 4%; font-size: 10px; letter-spacing: .2em; }
    .caption span { display: block; font-size: 9px; margin-top: 7px; color: var(--muted); letter-spacing: .12em; }
    .scene-number { position: absolute; right: 4%; bottom: 5.8%; font-family: Georgia, serif; font-size: 13px; font-style: italic; color: var(--muted); }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 21px 0 25px;
      border-top: 1px solid var(--line);
    }
    .ride-controls, .extras { display: flex; align-items: center; gap: 14px; }
    .ride-button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--white);
      border-radius: 100px;
      height: 46px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms, transform 150ms;
    }
    .ride-button:hover { background: #38665a; transform: translateY(-2px); }
    .ride-button:active { transform: translateY(0); }
    .ride-button svg, .extra-button svg { width: 17px; height: 17px; flex-shrink: 0; }
    .ride-button span { font-size: 12px; letter-spacing: .06em; }
    .speed-label { margin-left: 12px; font-size: 11px; color: var(--muted); }
    .speeds { display: flex; padding: 4px; background: #234a4308; border: 1px solid var(--line); border-radius: 100px; }
    .speed {
      background: none; color: #6c7b70; border: 0; padding: 9px 16px;
      font-size: 11px; cursor: pointer; border-radius: 100px;
      transition: background-color 160ms, color 160ms, box-shadow 160ms;
      white-space: nowrap;
    }
    .speed[aria-pressed="true"] { color: var(--ink); background: var(--white); box-shadow: 0 2px 5px #234a4310; }
    .speed:hover { color: var(--ink); }
    .extra-button {
      color: var(--ink); background: transparent; border: 0; padding: 10px 7px;
      display: inline-flex; gap: 8px; align-items: center;
      cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .extra-button:hover { color: #b45d41; }
    .extra-button:active svg { transform: rotate(-12deg); }
    .divider { height: 20px; width: 1px; background: var(--line); }
    footer { display: flex; justify-content: space-between; padding-bottom: 26px; font-size: 10px; letter-spacing: .1em; color: var(--muted); }
    .status { display: flex; gap: 7px; align-items: center; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #779b7b; }
    body[data-paused="true"] .status-dot { background: #c39b60; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .no-script { text-align: center; font-size: 12px; }
    @media (min-width: 1500px) {
      .page { max-width: 1320px; }
      .intro { padding-top: 45px; }
    }
    @media (max-width: 900px) {
      .page { width: calc(100% - 48px); }
      .masthead { height: 82px; }
      .intro { padding-top: 30px; }
      .intro-note { font-size: 10px; }
      .speed-label { display: none; }
      .ride-controls, .extras { gap: 9px; }
      .ride-button { padding: 0 18px; }
      .speed { padding: 9px 12px; }
      .controls { gap: 12px; }
    }
    @media (max-width: 600px) {
      .page { width: calc(100% - 36px); }
      .masthead { height: 78px; }
      .brand-mark { width: 37px; height: 37px; }
      .brand { gap: 8px; }
      .brand-name { font-size: 17px; }
      .brand-english { font-size: 7px; }
      .weather { font-size: 10px; gap: 5px; }
      .weather svg { width: 15px; }
      .weather-detail { display: none; }
      .intro { display: block; padding-top: 32px; }
      .eyebrow { font-size: 9px; margin-bottom: 13px; }
      h1 { font-size: clamp(32px, 9.8vw, 55px); }
      .intro-note { margin: 15px 0 0; font-size: 10px; line-height: 1.8; }
      .intro-note br { display: none; }
      .illustration { margin: 9px -18px 0; overflow: hidden; }
      .landscape { width: 142%; max-width: none; margin-left: -21%; }
      .caption { left: 7%; bottom: 5%; font-size: 8px; letter-spacing: .15em; }
      .caption span { font-size: 7px; margin-top: 5px; }
      .scene-number { right: 7%; bottom: 5%; font-size: 11px; }
      .controls { flex-wrap: wrap; justify-content: center; gap: 12px; padding: 20px 0 15px; }
      .ride-controls { flex: 1 1 100%; justify-content: space-between; gap: 8px; }
      .ride-button { height: 43px; padding: 0 16px; }
      .ride-button span { font-size: 11px; }
      .speed { font-size: 10px; padding: 8px 12px; }
      .extras { width: 100%; justify-content: center; gap: 23px; }
      .extra-button { font-size: 11px; }
      footer { padding-top: 5px; font-size: 8px; letter-spacing: .04em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body data-scene="day" data-paused="false">

            <circle cx="690" cy="251" r="2.5" fill="#52654f"/>
            <path d="M833 404h10v10h-10" fill="#da7954" stroke="#4d6859" stroke-width="2"/>
            <path d="m299 413-8 1-3 10 9 1" fill="#da7954" stroke="#4d6859" stroke-width="2"/>

            <!-- Pelican: oversized bill + deep throat pouch + curved neck. -->
            <g id="pelican">
              <path d="M448 271q-46-7-80-34 3 33 27 55l-43-14q15 33 63 44Z" fill="#f4f2e6" stroke="#385e50" stroke-width="3"/>
              <path d="M367 242q14 28 40 39m-47 1q30 26 62 23" fill="none" stroke="#9aaf99" stroke-width="3"/>
              <path d="M433 232c35-19 67-5 90-17 28-14 30-46 37-75 8-34 29-53 60-48 31 4 56 26 51 56l-19 27c-13 23-16 52-27 77-19 45-53 78-86 89-35 12-84 2-119-19-30-18-28-64 13-90Z" fill="#fffbee" stroke="#385e50" stroke-width="3.4"/>
              <path d="M435 321c39 13 90 24 130-4 31-22 51-53 58-92 2 54-32 103-84 116-36 11-74 1-104-20Z" fill="#e0e6ce"/>
              <path d="M580 132c-12 43-10 73-41 100" fill="none" stroke="#d6dfc5" stroke-width="11"/>
              <path d="m575 103-9-8 13 1-1-12 15 10" fill="#fffbee" stroke="#385e50" stroke-width="2.5"/>

              <!-- A soft cycling cap. -->
              <path d="M582 103c1-30 19-43 42-37 22 5 33 22 31 43Z" fill="#d67b59" stroke="#385e50" stroke-width="2.7"/>
              <path d="M611 66q18 13 15 40" fill="none" stroke="#f0c386" stroke-width="8"/>
              <path d="M581 102q39-6 75 4l20 8q-25 5-47-5l-49-1Z" fill="#bb664d" stroke="#385e50" stroke-width="2.5"/>
              <path d="M606 80q-10 4-13 12" fill="none" stroke="#efad80" stroke-width="2"/>

              <!-- Eye and a cheerful cheek. -->
              <path d="M627 118q8-5 15 0" fill="none" stroke="#496554" stroke-width="2.5"/>
              <g transform="translate(636 133)"><g id="pelican-eye"><ellipse rx="5.1" ry="6.2" fill="#294a40"/><circle cx="1.4" cy="-2" r="1.6" fill="#fffdf1"/></g></g>
              <ellipse cx="621" cy="148" rx="9" ry="5.5" fill="#e8a58b" opacity=".55"/>

              <!-- The pouch is the defining silhouette, not a duck's short beak. -->
              <path d="m657 155 204 12c-22 20-49 48-79 59-45 19-100 1-120-35l-11-22Z" fill="#ecc173" stroke="#8d7547" stroke-width="2.5"/>
              <path d="M671 178c20 35 66 51 100 37 25-10 46-24 64-40-25 30-71 63-111 51-28-7-44-23-53-48Z" fill="#e7aa65"/>
              <path d="M679 188q10 16 29 23m5 2 9 3" fill="none" stroke="#f6d695" stroke-width="2.5"/>
              <g id="fish" transform="translate(749 190) rotate(-12)">
                <path d="M-20 0q15-18 35-6l11-10-2 17 2 15L14 7Q-4 19-20 0Z" fill="#719d99" stroke="#487777" stroke-width="1.8"/>
                <path d="m-1-9 7-7 3 9m-8 17 7 4 3-7" fill="#83aaa3" stroke="#487777" stroke-width="1.4"/>
                <path d="M-7-6q7 6 0 13" fill="none" stroke="#b9cdb7" stroke-width="1.5"/>
                <circle cx="-12" cy="-2" r="2" fill="#294a40"/>
                <path d="m17-2 5-7m-6 12 6 6" stroke="#b9cdb7" stroke-width="1.3"/>
              </g>
              <path d="M657 140c65-3 132 6 206 20 8 2 11 5 3 10l-210-12Z" fill="#efb356" stroke="#8d7547" stroke-width="2.5"/>
              <path d="M670 145q104 2 179 17" fill="none" stroke="#ffdaa0" stroke-width="2.5"/>
              <path d="m853 161 16 4-8 10" fill="#d78549" stroke="#8d7547" stroke-width="1.8"/>
              <path d="m659 155 29 1" stroke="#aa7845" stroke-width="1.5"/>

              <!-- Wind-swept scarf tails are behind the knot. -->
              <g transform="translate(583 206)">
                <g id="scarf-tail">
                  <path d="M0-8C-36-32-61-18-99-38l5 17-14 5C-64 7-41-11-2 8Z" fill="#d97756" stroke="#9e6046" stroke-width="2"/>
                  <path d="M-7 1c-30 3-49 25-88 17l10 15-14 7C-50 54-27 27 1 10Z" fill="#cf6b50" stroke="#9e6046" stroke-width="2"/>
                  <path d="m-78-29-5 20m14-17-5 20m-4 24-1 20m11-21-1 20" stroke="#f4cf9c" stroke-width="4"/>
                </g>
              </g>
              <path d="M576 188q19 10 45 18l-7 19q-31-6-46-19Z" fill="#df805c" stroke="#9e6046" stroke-width="2.5"/>
              <path d="m601 200-6 19" stroke="#f4cf9c" stroke-width="5"/>
              <path d="M571 195q10-5 15 5l-5 14q-12 3-14-6Z" fill="#e58d64" stroke="#9e6046" stroke-width="2"/>

              <!-- One wing confidently holds the handlebar. -->
              <path d="M474 246c31-7 63 22 101 32 34 11 63 5 94-6 13-5 22 0 17 9-2 6-10 8-13 10-27 19-76 27-105 20-40 1-83-15-100-34-10-12-8-26 6-31Z" fill="#f7f6e7" stroke="#385e50" stroke-width="3"/>
              <path d="M487 270q38 34 92 30m-77-11q26 24 65 22m-40-34q35 26 64 21m-8-17q25 15 56 3" fill="none" stroke="#a3b59d" stroke-width="2.5"/>
              <path d="m666 279 11 1m-11 4 10 2" stroke="#7d9a81" stroke-width="1.8"/>
              <path d="M437 282q-7-16 6-26" fill="none" stroke="#e0e5ce" stroke-width="5"/>
            </g>

            <g id="near-leg" fill="none" stroke-linejoin="round"><path id="near-leg-outline" d="M512 337 558 391 577 459" stroke="#9b783e" stroke-width="12"/><path id="near-leg-path" d="M512 337 558 391 577 459" stroke="#e2ad58" stroke-width="8"/></g>
            <g id="near-foot" transform="translate(577 448)"><path d="M-14-4q10-6 23-1L22 3q3 4-3 5h-33Z" fill="#e6b25c" stroke="#947440" stroke-width="2"/><path d="M5-2 15 5M-1-1l8 6" stroke="#b98b43" stroke-width="1.5"/><path d="M-14 11h36" stroke="#35594c" stroke-width="5"/><path d="M-8 10h24" stroke="#b3bdaa" stroke-width="1.5"/></g>

            <g id="bell-bubble" opacity="0" transform="translate(699 219)">
              <path d="M0-30h64a12 12 0 0 1 12 12v13A12 12 0 0 1 64 7H21L5 18l4-11H0A12 12 0 0 1-12-5v-13A12 12 0 0 1 0-30Z" fill="#fffaf0" stroke="#b1bba0" stroke-width="1.5"/>
              <text x="33" y="-6" text-anchor="middle" fill="#476a51" font-size="17" font-family="'PingFang SC',sans-serif" letter-spacing="3">叮铃!</text>
              <path d="m-13 19-7 8m17-4-1 10" stroke="#b4884d" stroke-width="2"/>
            </g>
          </g>

          <!-- A hand-drawn note rather than another UI card. -->
          <g transform="translate(858 326) rotate(-7)" fill="#788773">
            <text font-family="'Songti SC','STSong',serif" font-size="15" letter-spacing="2">顺路载一位朋友。</text>
            <path d="M62-20q-2-44-53-71m2 10-4-14 14 4" fill="none" stroke="#8c9b80" stroke-width="1.3"/>
          </g>
        </svg>
        <figcaption class="caption">沿海公路 · 随便骑骑<span>LESS HURRY, MORE SEA BREEZE.</span></figcaption>
        <span class="scene-number" aria-hidden="true">a very ordinary, lovely day.</span>
      </figure>

      <div class="controls" aria-label="骑行互动控制">
        <div class="ride-controls">
          <button class="ride-button" id="play-button" type="button" aria-label="暂停骑行" aria-pressed="false">
            <svg id="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 4h3v12H5zm7 0h3v12h-3Z"/></svg>
            <span id="play-label">歇一会儿</span>
          </button>
          <span class="speed-label" id="speed-label">骑行节奏</span>
          <div class="speeds" role="group" aria-label="骑行速度">
            <button class="speed" type="button" data-speed="0.65" aria-pressed="false">慢悠悠</button>
            <button class="speed" type="button" data-speed="1" aria-pressed="true">刚刚好</button>
            <button class="speed" type="button" data-speed="1.75" aria-pressed="false">追海风</button>
          </div>
        </div>
        <div class="extras">
          <button class="extra-button" id="bell-button" type="button" title="按 B 键也可以响铃">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15a7 7 0 0 1 14 0v2H5Zm-2 2h18M10 20h4M12 6V3m5 2 2-2M5 8 3 6"/><path d="M8 13q0-3 3-4"/></svg>
            叮一下
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button class="extra-button" id="sunset-button" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 17h18M6 21h12M6 17a6 6 0 0 1 12 0M12 3v3M4 7l2 2m12 0 2-2M1 13h3m16 0h3"/></svg>
            <span id="sunset-label">等一场日落</span>
          </button>
        </div>
      </div>
      <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
      <noscript><p class="no-script">这幅画不需要联网。启用 JavaScript，就能陪鹈鹕一起兜风。</p></noscript>
    </section>
    <footer>
      <span>今日安排：没有安排。</span>
      <span class="status"><span class="status-dot" aria-hidden="true"></span><span id="ride-status">正在收集海风</span></span>
      <span>快乐，不计里程 ↗</span>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const state = { paused: motionPreference.matches, speed: 1, time: 0, sunset: false };
      const parts = {
        rig: $('ride-rig'), rear: $('rear-spokes'), front: $('front-spokes'),
        crank: $('crank'), nearOutline: $('near-leg-outline'), nearLeg: $('near-leg-path'),
        farLeg: $('far-leg-path'), nearFoot: $('near-foot'), farFoot: $('far-foot'),
        scarf: $('scarf-tail'), eye: $('pelican-eye'), fish: $('fish'),
        cloudOne: $('cloud-one'), cloudTwo: $('cloud-two'), cloudThree: $('cloud-three'),
        road: $('road-marks'), sea: $('sea-marks'), shadow: $('bike-shadow'),
        gullOne: $('gull-one'), gullTwo: $('gull-two'), bubble: $('bell-bubble')
      };
      let previousTime = null;
      let frame = 0;
      let bellStart = -Infinity;
      let audioContext = null;
      let announceTimer = null;

      // Two-link inverse kinematics: the knee bends, but the foot stays on the pedal.
      // This same construction works for a walking character or a two-joint robot arm.
      function legPath(hip, foot, bend) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 77;
        const lower = 86;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hip.x + along * dx / distance + bend * height * dy / distance;
        const kneeY = hip.y + along * dy / distance - bend * height * dx / distance;
        return `M${hip.x} ${hip.y}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
      }

      function draw(time) {
        const angle = time * 2.65 + 0.4;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 1.25;
        const pedal = (phase) => ({ x: 549 + Math.cos(phase) * 28, y: 459 + Math.sin(phase) * 28 });
        const near = pedal(angle);
        const far = pedal(angle + Math.PI);
        const nearPath = legPath({ x: 512, y: 337 }, near, 1);
        parts.nearLeg.setAttribute('d', nearPath);
        parts.nearOutline.setAttribute('d', nearPath);
        parts.farLeg.setAttribute('d', legPath({ x: 538, y: 328 }, far, -1));
        parts.nearFoot.setAttribute('transform', `translate(${near.x} ${near.y - 11})`);
        parts.farFoot.setAttribute('transform', `translate(${far.x} ${far.y - 7})`);
        parts.crank.setAttribute('transform', `translate(549 459) rotate(${degrees})`);
        parts.rear.setAttribute('transform', `rotate(${degrees * 2.1})`);
        parts.front.setAttribute('transform', `rotate(${degrees * 2.1})`);
        parts.rig.setAttribute('transform', `translate(0 ${bob})`);
        parts.scarf.setAttribute('transform', `rotate(${Math.sin(angle * 1.5) * 3.8}) scale(1 ${1 + Math.sin(angle * 2) * 0.06})`);
        parts.fish.setAttribute('transform', `translate(749 ${190 + Math.sin(time * 2) * 1.5}) rotate(${-12 + Math.sin(time * 2.1) * 4})`);
        parts.cloudOne.setAttribute('transform', `translate(${((208 - time * 5 + 1400) % 1400 + 1400) % 1400 - 100} 124)`);
        parts.cloudTwo.setAttribute('transform', `translate(${((868 - time * 8 + 1400) % 1400 + 1400) % 1400 - 100} 205) scale(.73)`);
        parts.cloudThree.setAttribute('transform', `translate(${((125 - time * 6 + 1400) % 1400 + 1400) % 1400 - 100} 247) scale(.65)`);
        parts.road.setAttribute('patternTransform', `translate(${-time * 124 % 190} 0)`);
        parts.sea.setAttribute('patternTransform', `translate(${-time * 17 % 230} 0)`);
        parts.gullOne.setAttribute('transform', `translate(0 ${Math.sin(time * 1.1) * 4})`);
        parts.gullTwo.setAttribute('transform', `translate(0 ${Math.sin(time * 1.1 + 1) * 3})`);
        parts.shadow.setAttribute('rx', 255 + bob * 2);
        const blinkPhase = time % 5.3;
        const blink = blinkPhase > 4.95 && blinkPhase < 5.13;
        parts.eye.setAttribute('transform', `scale(1 ${blink ? 0.12 : 1})`);
      }

      function tick(now) {
        frame = 0;
        const elapsed = previousTime === null ? 0 : Math.min((now - previousTime) / 1000, 0.06);
        previousTime = now;
        if (!state.paused) {
          state.time = (state.time + elapsed * state.speed) % 100000;
          draw(state.time);
        }
        const bellAge = (now - bellStart) / 1000;
        const ringing = bellAge >= 0 && bellAge < 1.4;
        if (ringing) {
          const opacity = Math.min(1, bellAge * 10, (1.4 - bellAge) * 3);
          parts.bubble.setAttribute('opacity', opacity);
          parts.bubble.setAttribute('transform', `translate(699 ${219 - (motionPreference.matches ? 0 : bellAge * 9)})`);
        } else {
          parts.bubble.setAttribute('opacity', '0');
        }
        if ((!state.paused || ringing) && !document.hidden) frame = requestAnimationFrame(tick);
        else previousTime = null;
      }

      function wake() {
        if (!frame && !document.hidden) {
          previousTime = null;
          frame = requestAnimationFrame(tick);
        }
      }

      function syncPlayback() {
        document.body.dataset.paused = String(state.paused);
        $('play-label').textContent = state.paused ? '继续兜风' : '歇一会儿';
        $('play-button').setAttribute('aria-label', state.paused ? '继续骑行' : '暂停骑行');
        $('play-button').setAttribute('aria-pressed', String(state.paused));
        $('play-icon').innerHTML = state.paused
          ? '<path d="m6 3 11 7-11 7Z"/>'
          : '<path d="M5 4h3v12H5zm7 0h3v12h-3Z"/>';
        $('ride-status').textContent = state.paused ? '停下来，也很好' : '正在收集海风';
        wake();
      }

      $('play-button').addEventListener('click', () => {
        state.paused = !state.paused;
        syncPlayback();
      });

      document.querySelectorAll('.speed').forEach((button) => {
        button.addEventListener('click', () => {
          state.speed = Number(button.dataset.speed);
          document.querySelectorAll('.speed').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
          // Selecting a speed must not silently undo an explicit pause.
          $('announcement').textContent = `骑行节奏：${button.textContent}${state.paused ? '，继续兜风后生效' : ''}`;
        });
      });

      async function ringBell() {
        bellStart = performance.now();
        $('announcement').textContent = '叮铃！借过一下，好心情来了。';
        clearTimeout(announceTimer);
        announceTimer = setTimeout(() => { $('announcement').textContent = ''; }, 1500);
        wake();
        // Sound is created locally, only after a user gesture. No audio file or network is needed.
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const start = audioContext.currentTime;
          for (const offset of [0, 0.15]) {
            for (const [frequency, volume, decay] of [[1568, 0.095, 0.6], [3136, 0.025, 0.22], [4210, 0.012, 0.12]]) {
              const oscillator = audioContext.createOscillator();
              const gain = audioContext.createGain();
              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0.0001, start + offset);
              gain.gain.exponentialRampToValueAtTime(volume, start + offset + 0.004);
              gain.gain.exponentialRampToValueAtTime(0.0001, start + offset + decay);
              oscillator.connect(gain);
              gain.connect(audioContext.destination);
              oscillator.start(start + offset);
              oscillator.stop(start + offset + decay + 0.02);
              oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
            }
          }
        } catch {
          // The illustrated bell remains useful if the browser disallows audio.
        }
      }
      $('bell-button').addEventListener('click', ringBell);
      document.addEventListener('keydown', (event) => {
        if (event.defaultPrevented || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target instanceof HTMLElement && (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))) return;
        if (event.key.toLowerCase() === 'b') ringBell();
      });

      $('sunset-button').addEventListener('click', () => {
        state.sunset = !state.sunset;
        document.body.dataset.scene = state.sunset ? 'sunset' : 'day';
        $('sunset-button').setAttribute('aria-pressed', String(state.sunset));
        $('sunset-label').textContent = state.sunset ? '回到午后' : '等一场日落';
        $('weather-label').innerHTML = state.sunset ? '落日温柔<span class="weather-detail"> · 宜发呆</span>' : '海风微甜<span class="weather-detail"> · 宜兜风</span>';
        document.querySelector('meta[name="theme-color"]').content = state.sunset ? '#f3e5d7' : '#f5f1e7';
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(frame);
          frame = 0;
          previousTime = null;
        } else wake();
      });
      motionPreference.addEventListener('change', () => {
        state.paused = motionPreference.matches;
        syncPlayback();
      });

      draw(0);
      syncPlayback();
    })();
  </script>
</body>
