<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚴 骑自行车的鹈鹕</title>
<style>
  :root{
    --ink:#1f2937;
    --card:rgba(255,255,255,.72);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Segoe UI,sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, #ffe9b0 0%, transparent 60%),
      linear-gradient(160deg,#2b5876 0%,#4e4376 100%);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px 32px;
    min-height:100%;
  }
  h1{
    margin:0 0 4px; font-size:clamp(20px,3.4vw,32px); letter-spacing:.06em;
    color:#fff; text-shadow:0 2px 18px rgba(0,0,0,.35);
  }
  .sub{margin:0 0 16px;color:rgba(255,255,255,.68);font-size:13px;letter-spacing:.1em}
  .stage{
    width:min(960px,100%);
    border-radius:22px; overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.18) inset;
    background:#bfe9ff; cursor:pointer; user-select:none;
    position:relative;
  }
  .stage svg{display:block;width:100%;height:auto}
  .hint{
    position:absolute; right:14px; top:12px; z-index:3;
    font-size:12px; letter-spacing:.08em; color:#0b4a6f;
    background:rgba(255,255,255,.55); border-radius:999px; padding:6px 12px;
    backdrop-filter:blur(6px); pointer-events:none;
    transition:opacity .4s;
  }
  .panel{
    margin-top:16px; width:min(960px,100%);
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    background:var(--card); backdrop-filter:blur(10px);
    border-radius:16px; padding:12px 18px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.5);
    font-size:14px;
  }
  .panel label{display:flex;align-items:center;gap:10px;font-weight:600}
  input[type=range]{width:190px;accent-color:#ef476f}
  button{
    font:inherit;font-weight:700;border:0;cursor:pointer;
    padding:8px 16px;border-radius:999px;
    background:#ef476f;color:#fff;box-shadow:0 6px 16px -6px #ef476f;
    transition:transform .12s ease, filter .12s ease;
  }
  button:hover{transform:translateY(-1px);filter:brightness(1.07)}
  button.ghost{background:#264653;box-shadow:0 6px 16px -6px #264653}
  .readout{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:#264653}
  .readout span{color:#ef476f}
</style>
</head>
<body>

<h1>骑 自 行 车 的 鹈 鹕</h1>
<p class="sub">A PELICAN ON A BICYCLE · 点击画面加速</p>

<div class="stage" id="stage">
  <div class="hint" id="hint">点击画面 → 冲刺 🚀</div>

  <svg id="scene" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#3fa9f5"/>
        <stop offset="45%" stop-color="#9ad9f7"/>
        <stop offset="100%" stop-color="#ffe3b8"/>
      </linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%"  stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#f3f6fb"/>
        <stop offset="100%" stop-color="#d3dcea"/>
      </linearGradient>
      <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0%"  stop-color="#ffd166"/>
        <stop offset="55%" stop-color="#fca311"/>
        <stop offset="100%" stop-color="#f07c1f"/>
      </linearGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffb84d"/>
        <stop offset="100%" stop-color="#ef6f2e"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4c5566"/>
        <stop offset="100%" stop-color="#2b313d"/>
      </linearGradient>
      <linearGradient id="helmet" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0%" stop-color="#ff7b9c"/>
        <stop offset="55%" stop-color="#ef476f"/>
        <stop offset="100%" stop-color="#b62d4c"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity=".85"/>
        <stop offset="38%"  stop-color="#fffaf0" stop-opacity=".38"/>
        <stop offset="70%"  stop-color="#ffffff" stop-opacity=".14"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>

    <!-- ================= 背景 ================= -->
    <rect width="900" height="540" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g id="sun" transform="translate(760,104)">
      <circle r="96" fill="url(#sunGlow)"/>
      <g id="rays" opacity=".5">
        <g stroke="#fffaf0" stroke-width="5" stroke-linecap="round">
          <line y1="-52" y2="-74"/><line y1="52" y2="74"/>
          <line x1="-52" x2="-74"/><line x1="52" x2="74"/>
          <line x1="-37" y1="-37" x2="-53" y2="-53"/>
          <line x1="37" y1="37" x2="53" y2="53"/>
          <line x1="-37" y1="37" x2="-53" y2="53"/>
          <line x1="37" y1="-37" x2="53" y2="-53"/>
        </g>
      </g>
      <circle r="40" fill="#fffaec"/>
      <circle r="33" fill="#ffd875"/>
    </g>

    <!-- 云（远景视差） -->
    <g id="clouds" opacity=".92"></g>

    <!-- 远山 -->
    <g id="hillsFar" fill="#8fd0c4" opacity=".75"></g>
    <!-- 近山 -->
    <g id="hillsNear" fill="#5fb49c"></g>

    <!-- 草地 -->
    <rect x="0" y="418" width="900" height="24" fill="#7cc796"/>
    <!-- 灌木（近景视差） -->
    <g id="bushes"></g>

    <!-- 路面 -->
    <rect x="0" y="430" width="900" height="80" fill="url(#road)"/>
    <rect x="0" y="430" width="900" height="4" fill="#6b7688"/>
    <line id="dashes" x1="-200" y1="474" x2="1100" y2="474"
          stroke="#f2f5f9" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="54 46" opacity=".85"/>

    <!-- 尘土 -->
    <g id="dust" fill="#ffffff" opacity=".55"></g>

    <!-- 速度线 -->
    <g id="speedlines" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0"></g>

    <!-- ================= 车 + 鹈鹕 ================= -->
    <g id="rig" transform="translate(0,0)">

      <!-- 影子 -->
      <ellipse id="shadow" cx="432" cy="436" rx="180" ry="15" fill="#1b2430" opacity=".28" filter="url(#soft)"/>

      <!-- 远侧腿 + 远侧曲柄 -->
      <g id="legFar">
        <line id="crankFar" stroke="#6b7280" stroke-width="9" stroke-linecap="round"/>
        <rect id="pedalFar" x="-13" y="-4" width="26" height="8" rx="3" fill="#3c4453"/>
        <path id="boneFar" fill="none" stroke="#cdbba6" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
        <g id="footFar">
          <path d="M-10,-13 L3,-15 L24,-7 L26,-2 L-4,-2 Z"
                fill="#d9a441" stroke="#b07f2a" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- 自行车 -->
      <g id="bike">
        <!-- 后轮 -->
        <g transform="translate(300,368)">
          <circle r="62" fill="none" stroke="#2b313d" stroke-width="11"/>
          <circle r="53" fill="none" stroke="#cfd6e0" stroke-width="4"/>
          <g class="spokes" id="spokeRear" stroke="#e7ecf3" stroke-width="2.2" opacity=".95">
            <line y1="-51" y2="51"/><line x1="-51" x2="51"/>
            <line x1="-36" y1="-36" x2="36" y2="36"/>
            <line x1="-36" y1="36" x2="36" y2="-36"/>
            <line x1="-19.5" y1="-47" x2="19.5" y2="47"/>
            <line x1="19.5" y1="-47" x2="-19.5" y2="47"/>
            <line x1="-47" y1="-19.5" x2="47" y2="19.5"/>
            <line x1="47" y1="-19.5" x2="-47" y2="19.5"/>
          </g>
          <circle r="13" fill="#9aa4b2"/><circle r="6" fill="#5b6472"/>
          <circle r="19" fill="none" stroke="#7d8794" stroke-width="3"/>
        </g>
        <!-- 前轮 -->
        <g transform="translate(560,368)">
          <circle r="62" fill="none" stroke="#2b313d" stroke-width="11"/>
          <circle r="53" fill="none" stroke="#cfd6e0" stroke-width="4"/>
          <g class="spokes" id="spokeFront" stroke="#e7ecf3" stroke-width="2.2" opacity=".95">
            <line y1="-51" y2="51"/><line x1="-51" x2="51"/>
            <line x1="-36" y1="-36" x2="36" y2="36"/>
            <line x1="-36" y1="36" x2="36" y2="-36"/>
            <line x1="-19.5" y1="-47" x2="19.5" y2="47"/>
            <line x1="19.5" y1="-47" x2="-19.5" y2="47"/>
            <line x1="-47" y1="-19.5" x2="47" y2="19.5"/>
            <line x1="47" y1="-19.5" x2="-47" y2="19.5"/>
          </g>
          <circle r="11" fill="#9aa4b2"/><circle r="5" fill="#5b6472"/>
        </g>

        <!-- 链条 -->
        <g stroke="#8b96a5" stroke-width="4" fill="none">
          <line id="chainTop" x1="300" y1="357" x2="420" y2="356" stroke-dasharray="7 5"/>
          <line id="chainBot" x1="300" y1="379" x2="420" y2="380" stroke-dasharray="7 5"/>
        </g>

        <!-- 车架 -->
        <g stroke="#1d6a75" stroke-width="11" stroke-linecap="round" fill="none">
          <path d="M420,368 L372,256"/>                <!-- 座管 -->
          <path d="M372,256 L534,248"/>                <!-- 上管 -->
          <path d="M420,368 L548,300"/>                <!-- 下管 -->
          <path d="M420,368 L300,368"/>                <!-- 后下叉 -->
          <path d="M300,368 L374,262"/>                <!-- 后上叉 -->
        </g>
        <g stroke="#2d8f9c" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85">
          <path d="M424,362 L378,258"/>
          <path d="M378,252 L530,245"/>
        </g>
        <!-- 前叉 + 头管 -->
        <g stroke="#1d6a75" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M534,244 L552,302"/>
          <path d="M548,286 Q562,330 560,368"/>
        </g>
        <!-- 车把 -->
        <g stroke="#264653" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M534,244 L556,235"/>
          <path d="M556,235 Q588,232 590,254"/>
        </g>
        <circle cx="590" cy="256" r="8" fill="#ef476f"/>
        <!-- 车座 -->
        <path d="M340,250 Q368,238 392,250 Q368,258 340,250 Z" fill="#264653"/>
        <!-- 牙盘 -->
        <circle cx="420" cy="368" r="22" fill="none" stroke="#9aa4b2" stroke-width="5"/>
        <circle cx="420" cy="368" r="22" fill="none" stroke="#dfe5ee" stroke-width="2" stroke-dasharray="3 4"/>
        <circle cx="420" cy="368" r="7" fill="#5b6472"/>
        <!-- 后齿盘 -->
        <circle cx="300" cy="368" r="11" fill="none" stroke="#aab3c0" stroke-width="4"/>
        <!-- 车铃 -->
        <g id="bell" transform="translate(566,228)">
          <path d="M-9,0 a9,9 0 0 1 18,0 z" fill="#ffd166" stroke="#c9962a" stroke-width="2"/>
          <rect x="-11" y="0" width="22" height="4" rx="2" fill="#c9962a"/>
        </g>
      </g>

      <!-- ================= 鹈鹕 ================= -->
      <g id="pelican">
        <!-- 尾羽 -->
        <path d="M262,196 L196,178 L212,208 L192,226 L258,224 Z"
              fill="#e8eef7" stroke="#c3cede" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- 身体 -->
        <ellipse cx="336" cy="206" rx="84" ry="60" fill="url(#body)" stroke="#c3cede" stroke-width="2.5"
                 transform="rotate(-9 336 206)"/>
        <!-- 腹部阴影 -->
        <path d="M268,232 Q336,286 404,226 Q340,262 268,232 Z" fill="#c9d4e4" opacity=".55"/>
        <!-- 折起的翅膀（后） -->
        <path d="M300,178 Q356,158 400,190 Q368,232 310,222 Q286,202 300,178 Z"
              fill="#eaf0f8" stroke="#c3cede" stroke-width="2.5"/>
        <g stroke="#c3cede" stroke-width="2" fill="none" opacity=".8">
          <path d="M314,200 Q348,192 386,200"/>
          <path d="M310,212 Q346,206 380,214"/>
        </g>

        <!-- 脖子 + 头（会随踩踏轻微点头） -->
        <g id="head">
          <path d="M382,182 Q404,120 470,112 L498,152 Q436,158 414,206 Z"
                fill="url(#body)" stroke="#c3cede" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- 头 -->
          <circle cx="496" cy="130" r="31" fill="url(#body)" stroke="#c3cede" stroke-width="2.5"/>
          <!-- 喉囊 -->
          <path d="M512,146 Q536,214 606,190 L660,158 Q590,176 524,140 Z"
                fill="url(#pouch)" stroke="#d8752a" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- 上喙 -->
          <path d="M514,120 Q590,124 672,150 Q600,164 512,146 Z"
                fill="url(#beak)" stroke="#d8752a" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M520,126 Q590,132 654,150" stroke="#ffe3a3" stroke-width="3" fill="none" opacity=".8"/>
          <!-- 喙上的小尖钩 -->
          <path d="M668,149 L678,153 L668,157 Z" fill="#d8752a"/>
          <!-- 鼻孔 -->
          <ellipse cx="540" cy="131" rx="5" ry="2.6" fill="#c96a1f" opacity=".7"/>
          <!-- 眼睛 -->
          <circle cx="500" cy="126" r="11" fill="#fff" stroke="#98a6bd" stroke-width="2"/>
          <circle id="pupil" cx="503" cy="127" r="6.4" fill="#1f2937"/>
          <circle cx="505.5" cy="124" r="2.2" fill="#fff"/>
          <!-- 头盔 -->
          <g id="helmetG">
            <path d="M462,116 Q466,78 506,76 Q550,76 556,110 Q562,122 548,118 Q506,96 468,126 Z"
                  fill="url(#helmet)" stroke="#9e2743" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M476,108 Q506,88 538,102" stroke="#ffd7e0" stroke-width="4" fill="none" opacity=".8"/>
            <path d="M470,96 Q500,82 528,88" stroke="#ffffff" stroke-width="3" fill="none" opacity=".45"/>
            <!-- 通风孔 -->
            <path d="M492,84 L500,102 M516,84 L522,100" stroke="#9e2743" stroke-width="3" opacity=".55" fill="none"/>
            <!-- 帽带 -->
            <path d="M470,124 Q476,148 498,154" stroke="#9e2743" stroke-width="3" fill="none"/>
          </g>
        </g>

        <!-- 前侧翅膀：抓车把 -->
        <g id="wing">
          <path id="wingPath"
                d="M398,178 Q496,178 570,234 Q598,250 590,268 Q578,282 556,268 Q462,240 386,222 Z"
                fill="#f7fafd" stroke="#b9c5d8" stroke-width="2.5" stroke-linejoin="round"/>
          <g id="wingLines" stroke="#c3cede" stroke-width="2" fill="none" opacity=".85">
            <path d="M424,198 Q492,206 556,246"/>
            <path d="M420,212 Q490,222 548,258"/>
          </g>
          <!-- 抓把手的“指” -->
          <path d="M586,252 Q600,262 592,272" stroke="#b9c5d8" stroke-width="2.5" fill="none"/>
        </g>
      </g>

      <!-- 近侧腿 + 近侧曲柄 -->
      <g id="legNear">
        <line id="crankNear" stroke="#aab3c0" stroke-width="10" stroke-linecap="round"/>
        <rect id="pedalNear" x="-15" y="-5" width="30" height="10" rx="3" fill="#264653"/>
        <path id="boneNear" fill="none" stroke="#f0dcc2" stroke-width="17"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path id="boneNearHi" fill="none" stroke="#fff6e8" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
        <g id="footNear">
          <path d="M-13,-16 L4,-18 L30,-8 L32,-2 L-5,-2 Z"
                fill="#fca311" stroke="#d8752a" stroke-width="2" stroke-linejoin="round"/>
          <path d="M6,-17 L9,-3 M19,-12 L20,-3" stroke="#d8752a" stroke-width="1.6" opacity=".65" fill="none"/>
        </g>
      </g>
    </g>

    <!-- 前景草坡（最快视差） -->
    <rect x="0" y="506" width="900" height="34" fill="#2f7d5f"/>
    <rect x="0" y="504" width="900" height="3" fill="#48a077" opacity=".8"/>
    <g id="grassFront"></g>
  </svg>
</div>

<div class="panel">
  <label>踏频
    <input id="speed" type="range" min="0" max="100" value="46">
  </label>
  <button id="boost">🚀 冲刺</button>
  <button id="pause" class="ghost">⏸ 暂停</button>
  <div class="readout">时速 <span id="kmh">0.0</span> km/h · 里程 <span id="km">0.00</span> km</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  /* ---------- 程序化生成背景元素 ---------- */
  const mk = (tag, attrs) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };

  // 云：用椭圆堆出蓬松的云团
  const cloudBlobs = [[0,0,48,26],[-38,8,32,18],[38,7,34,20],[6,-16,28,20],[-14,-8,30,22]];
  const cloudsG = $('clouds');
  const cloudSeeds = [[90,58,1.0,.95],[350,34,.66,.8],[610,64,.8,.85],[830,40,.55,.7]];
  for (let rep = 0; rep < 2; rep++) {
    cloudSeeds.forEach(([x, y, s, o]) => {
      const g = mk('g', {transform: `translate(${x + rep * 900},${y}) scale(${s})`, opacity: o});
      cloudBlobs.forEach(([cx, cy, rx, ry]) =>
        g.appendChild(mk('ellipse', {cx, cy: cy + 6, rx, ry: ry * .85, fill: '#cfe8fa'})));
      cloudBlobs.forEach(([cx, cy, rx, ry]) =>
        g.appendChild(mk('ellipse', {cx, cy, rx, ry, fill: '#ffffff'})));
      cloudsG.appendChild(g);
    });
  }

  // 山
  const farD  = 'M0,430 C70,352 120,340 186,384 C250,426 300,320 386,346 C458,368 512,300 596,338 C668,370 724,326 806,364 C852,386 878,404 900,430 Z';
  const nearD = 'M0,430 C64,392 118,398 176,416 C238,436 286,372 356,392 C420,410 470,376 536,400 C606,426 664,388 736,404 C800,418 860,420 900,430 Z';
  for (let rep = 0; rep < 2; rep++) {
    $('hillsFar').appendChild(mk('path', {d: farD, transform: `translate(${rep * 900},0)`}));
    $('hillsNear').appendChild(mk('path', {d: nearD, transform: `translate(${rep * 900},0)`}));
  }

  // 灌木
  const bushesG = $('bushes');
  for (let rep = 0; rep < 2; rep++) {
    [[40,.9],[210,.7],[330,1.1],[520,.8],[700,1.0],[830,.65]].forEach(([x, s]) => {
      const g = mk('g', {transform: `translate(${x + rep * 900},424) scale(${s})`});
      g.appendChild(mk('ellipse', {cx: 0, cy: 0, rx: 26, ry: 16, fill: '#3f9d7c'}));
      g.appendChild(mk('ellipse', {cx: -14, cy: 4, rx: 16, ry: 11, fill: '#4fb48f'}));
      g.appendChild(mk('ellipse', {cx: 14, cy: 5, rx: 14, ry: 10, fill: '#4fb48f'}));
      bushesG.appendChild(g);
    });
  }

  // 前景草坡上的草尖
  const grassG = $('grassFront');
  for (let rep = 0; rep < 2; rep++) {
    for (let i = 0; i < 20; i++) {
      const x = i * 45 + (i % 3) * 7 + rep * 900;
      const h = 16 + (i % 4) * 7;
      grassG.appendChild(mk('path', {
        d: `M${x},512 q4,-${h} -3,-${h + 8} M${x + 11},512 q7,-${h - 4} 5,-${h + 4} M${x - 9},512 q-6,-${h - 6} -2,-${h + 2}`,
        stroke: '#2f7d5f', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round'
      }));
    }
  }

  // 尘土
  const dustG = $('dust');
  const puffs = [];
  for (let i = 0; i < 7; i++) {
    const c = mk('circle', {cx: 0, cy: 0, r: 0});
    dustG.appendChild(c);
    puffs.push({el: c, t: i / 7});
  }

  // 速度线
  const slG = $('speedlines');
  const lines = [];
  for (let i = 0; i < 6; i++) {
    const l = mk('line', {x1: 0, y1: 0, x2: 0, y2: 0});
    slG.appendChild(l);
    lines.push({el: l, y: 110 + i * 48, len: 40 + (i % 3) * 34, ph: Math.random()});
  }

  /* ---------- 骨骼参数 ---------- */
  const BB = {x: 420, y: 368};      // 五通中心
  const CRANK = 30;                 // 曲柄长
  const WHEEL_R = 62;
  const HIP_NEAR = {x: 374, y: 244};   // 髋关节：坐垫上方
  const HIP_FAR  = {x: 364, y: 247};
  const THIGH = 88, SHIN = 82;

  // 二连杆 IK：返回膝关节坐标
  function knee(hip, foot, l1, l2, sign) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
    return {
      x: hip.x + a * ux + sign * h * -uy,
      y: hip.y + a * uy + sign * h * ux
    };
  }

  /* ---------- 状态 ---------- */
  let dist = 0;           // 累计位移（像素）
  let vel = 0;            // 当前速度 px/s
  let boost = 0;
  let paused = false;
  let last = performance.now();
  const speedEl = $('speed');

  const wrap = (v, m) => ((v % m) + m) % m;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (!paused) {
      const target = speedEl.value * 7 + boost;      // 目标速度
      vel += (target - vel) * Math.min(dt * 2.4, 1);
      boost *= Math.pow(0.25, dt);
      dist += vel * dt;
    } else {
      vel += (0 - vel) * Math.min(dt * 6, 1);
    }

    const fast = Math.min(vel / 900, 1);

    /* 背景视差 */
    $('clouds').setAttribute('transform',   `translate(${-wrap(dist * 0.035, 900)},0)`);
    $('hillsFar').setAttribute('transform', `translate(${-wrap(dist * 0.10, 900)},0)`);
    $('hillsNear').setAttribute('transform',`translate(${-wrap(dist * 0.26, 900)},0)`);
    $('bushes').setAttribute('transform',   `translate(${-wrap(dist * 0.62, 900)},0)`);
    $('grassFront').setAttribute('transform', `translate(${-wrap(dist * 1.35, 900)},0)`);
    $('dashes').setAttribute('stroke-dashoffset', wrap(dist, 100));
    $('rays').setAttribute('transform', `rotate(${dist * 0.02})`);

    /* 轮子 & 链条 */
    const wheelDeg = dist / WHEEL_R * 180 / Math.PI;
    $('spokeRear').setAttribute('transform', `rotate(${wheelDeg})`);
    $('spokeFront').setAttribute('transform', `rotate(${wheelDeg})`);
    $('chainTop').setAttribute('stroke-dashoffset', -wrap(dist * 0.6, 12));
    $('chainBot').setAttribute('stroke-dashoffset',  wrap(dist * 0.6, 12));

    /* 曲柄角（齿比：轮子转一圈 ≈ 曲柄转 0.62 圈） */
    const ang = dist / WHEEL_R * 0.62;
    const pedal = (phase) => ({
      x: BB.x + CRANK * Math.cos(ang + phase),
      y: BB.y + CRANK * Math.sin(ang + phase)
    });
    const pN = pedal(0), pF = pedal(Math.PI);

    /* 车身颠簸 */
    const bob = Math.sin(ang * 2) * 2.2 + Math.sin(dist * 0.05) * 0.8 * fast;
    $('rig').setAttribute('transform', `translate(0,${bob.toFixed(2)})`);

    /* 腿部 IK：膝向前弯，活动域落在车架前三角里 */
    const kN = knee(HIP_NEAR, pN, THIGH, SHIN, -1);
    const kF = knee(HIP_FAR,  pF, THIGH, SHIN, -1);
    const dN = `M${HIP_NEAR.x},${HIP_NEAR.y} L${kN.x.toFixed(1)},${kN.y.toFixed(1)} L${pN.x.toFixed(1)},${pN.y.toFixed(1)}`;
    const dF = `M${HIP_FAR.x},${HIP_FAR.y} L${kF.x.toFixed(1)},${kF.y.toFixed(1)} L${pF.x.toFixed(1)},${pF.y.toFixed(1)}`;
    $('boneNear').setAttribute('d', dN);
    $('boneNearHi').setAttribute('d', dN);
    $('boneFar').setAttribute('d', dF);

    /* 踏板 & 脚掌 */
    const footRot = p => Math.sin(ang + p) * 12;
    $('crankNear').setAttribute('x1', BB.x); $('crankNear').setAttribute('y1', BB.y);
    $('crankNear').setAttribute('x2', pN.x); $('crankNear').setAttribute('y2', pN.y);
    $('crankFar').setAttribute('x1', BB.x);  $('crankFar').setAttribute('y1', BB.y);
    $('crankFar').setAttribute('x2', pF.x);  $('crankFar').setAttribute('y2', pF.y);
    $('pedalNear').setAttribute('transform', `translate(${pN.x},${pN.y})`);
    $('pedalFar').setAttribute('transform',  `translate(${pF.x},${pF.y})`);
    $('footNear').setAttribute('transform', `translate(${pN.x.toFixed(1)},${pN.y.toFixed(1)}) rotate(${footRot(0).toFixed(1)})`);
    $('footFar').setAttribute('transform',  `translate(${pF.x.toFixed(1)},${pF.y.toFixed(1)}) rotate(${footRot(Math.PI).toFixed(1)})`);

    /* 头部点头 + 眼神 */
    const nod = Math.sin(ang * 2 + 0.6) * 1.9;
    $('head').setAttribute('transform',
      `rotate(${nod.toFixed(2)} 430,180) translate(${(fast * 5).toFixed(1)},${(-fast * 3).toFixed(1)})`);
    $('pupil').setAttribute('cx', (503 + fast * 2.2).toFixed(1));

    /* 翅膀：随颠簸轻微起伏 */
    const wingT = Math.sin(ang * 2 + 1.2) * 0.45;
    $('wing').setAttribute('transform', `rotate(${wingT.toFixed(2)} 392,200)`);

    /* 影子 */
    $('shadow').setAttribute('opacity', (0.3 - bob * 0.012).toFixed(3));

    /* 尘土 */
    puffs.forEach(p => {
      p.t = (p.t + dt * (0.5 + fast * 1.6)) % 1;
      const e = p.el, k = p.t;
      e.setAttribute('cx', 262 - k * 150);
      e.setAttribute('cy', 410 - k * 34 + Math.sin(k * 9) * 5);
      e.setAttribute('r', (5 + k * 22).toFixed(1));
      e.setAttribute('opacity', ((1 - k) * 0.32 * fast).toFixed(3));
    });

    /* 速度线 */
    slG.setAttribute('opacity', (Math.max(0, fast - 0.32) * 1.2).toFixed(3));
    lines.forEach(l => {
      const x = 980 - wrap(dist * 2.2 + l.ph * 900, 1180);
      l.el.setAttribute('x1', x); l.el.setAttribute('x2', x + l.len);
      l.el.setAttribute('y1', l.y); l.el.setAttribute('y2', l.y);
      l.el.setAttribute('opacity', .5);
    });

    /* 仪表 */
    $('kmh').textContent = (vel * 0.05).toFixed(1);
    $('km').textContent = (dist / 12000).toFixed(2);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 交互 ---------- */
  const hint = $('hint');
  let hinted = false;
  const doBoost = () => {
    boost = 420;
    if (!hinted) { hinted = true; hint.style.opacity = 0; }
  };
  $('stage').addEventListener('click', doBoost);
  $('boost').addEventListener('click', e => { e.stopPropagation(); doBoost(); });
  $('pause').addEventListener('click', e => {
    paused = !paused;
    e.target.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); doBoost(); }
  });
})();
</script>
</body>
</html>
