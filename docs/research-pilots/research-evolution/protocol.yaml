# 四周试点协议模板（pilot-protocol/v1）
#
# 用法：复制本文件，填好任务卡与配对，然后在采集任何事件之前冻结：
#   .venv-workbench/bin/python -m intelligence.eval.product_value freeze --protocol protocol.yaml --out protocol.frozen.yaml
# 冻结会写入 protocol_hash；之后任何字段改动都会让 CLI 以 exit 2 拒绝。改判据 = 另开一版协议、另开一组参与者。
#
# 下面的判据阈值是 spec 05 §4 表里的经营判据，不是统计显著性门槛；达标只建议「继续验证」。
schema_version: pilot-protocol/v1
protocol_version: pilot-2026-10-v1          # 改判据必须改版本号
pilot_id: pilot-2026-10                     # 与所有事件的 pilot_id 一致
frozen_at: "2026-10-01T09:00:00+08:00"      # 冻结时刻（进哈希）
task_categories:
  - fact_check                              # 事实 / 计算核对
  - judgment_recheck                        # 旧判断变化 / 回检
cases:
  # 每类至少两案（A/B），难度、来源规模、截止时点、交付物匹配；见 task-cards.md
  - {case_id: case-fc-A, case_version: "1", category: fact_check, title: "<A 案标题>", deliverable: "核对单 + 出处列表", source_scale: "<3 份公告>", cutoff: "<数据截止日>"}
  - {case_id: case-fc-B, case_version: "1", category: fact_check, title: "<B 案标题>", deliverable: "核对单 + 出处列表", source_scale: "<3 份公告>", cutoff: "<数据截止日>"}
  - {case_id: case-jr-A, case_version: "1", category: judgment_recheck, title: "<A 案标题>", deliverable: "变化单 + 维持/修订结论", source_scale: "<1 条判断 + 5 条新证据>", cutoff: "<数据截止日>"}
  - {case_id: case-jr-B, case_version: "1", category: judgment_recheck, title: "<B 案标题>", deliverable: "变化单 + 维持/修订结论", source_scale: "<1 条判断 + 5 条新证据>", cutoff: "<数据截止日>"}
case_pairs:
  # 一对 = 同一参与者在两个匹配案上各做一次（一次原流程、一次辅助流程），顺序事前预分配；同人不重复同案
  - {case_pair_id: pair-fc-01, category: fact_check, case_ids: [case-fc-A, case-fc-B]}
  - {case_pair_id: pair-jr-01, category: judgment_recheck, case_ids: [case-jr-A, case-jr-B]}
rubric:
  rubric_version: rubric-v1                 # 见 rubric.md；维度顺序与名称是 v1 合同，不可改
  dimensions: [fact_sourcing, calculation, assumption_gaps, task_completion]
  max_per_dimension: 2
  severe_error_rule: "关键事实或计算错误各计一次严重错误；争议留裁决"
allowed_pause_reasons:                       # 只有这些暂停会从端到端耗时里扣除；其它暂停照记不扣
  - pre_registered_break
  - scheduled_meeting
criteria:
  completion_quality: {severe_error_max: 0}
  time_saving: {min_participants: 3, min_complete_pairs: 6, require_both_categories: true, median_saving_min: 0.20}
  proactive_reuse: {min_participants: 3, min_rate: 0.50, manual_reminder_quiet_hours: 72}
  recheck: {}                                # 只展示比率，无阈值
  cost: {}                                   # 已知 / 估算 / 未知并列，缺项时完整成本与毛利 unknown
  renewal: {renewal_window_days: 14}         # 首期到期后 14 天进入续费窗口
exclusion_rules:                             # 排除只能命中这里登记过的规则；失败 / 放弃 / 退出不能为改善读数删除
  - {rule_id: original_time_zero, rule_version: "1", description: "原流程耗时为 0 的配对不进省时中位数，比例单列"}
  - {rule_id: consent_withdrawn, rule_version: "1", description: "撤回研究/日志同意后的事件不进有效测量，退出计数保留"}
  - {rule_id: consent_scope, rule_version: "1", description: "未同意盲审的评审不进质量读数"}
  - {rule_id: conflicting_event_id, rule_version: "1", description: "同 ID 不同内容的事件整体不进计算"}
cohort_window: {start: "2026-10-05", end: "2026-11-01"}   # 四周；as_of 缺省取 end
