brief_id: 2026-07-05-launch-batch
objective: 为 FinHot 和金融 Agent 生成第一批产品介绍内容（产品是什么、能做什么、怎么用）
channels: [x_thread, zhihu_article, short_video]
personas: [subjective-trader, finance-creator, ai-tool-enthusiast]
products: [finhot, finance_agent]
content_types:
  - feature_showcase
  - use_case_story
  - demo_script
  - pain_point_post
required_claim_ids:
  - claim-finhot-one-feed
  - claim-finhot-source-evidence
  - claim-finance-daily-review
  - claim-finance-theme-radar
  - claim-evidence-first-research
  - claim-combo-workflow
quotas:
  short_post: 10
  longform_outline: 3
  short_video_script: 2
constraints:
  - 产品介绍为主线，教学向内容占比不超过 20%
  - 不承诺收益、不给买卖指令、不包装为投资建议
  - 内部路径可在内部草稿出现，对外发布需替换为泛化描述或截图
  - 对外内容避免泄露私有仓库细节
  - 每条内容必须标注 claim_ids 或 feature_ids
