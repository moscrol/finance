claims:
  - id: claim-finhot-one-feed
    text: FinHot 把 RSS、微博、雪球、微信、X 聚合成一条可打分、可摘要的金融信息流，让高信号内容浮上来。
    product_ids: [finhot]
    support_feature_ids: [finhot-multi-source-feed, finhot-ai-summary]
    allowed_channels: [longform, short_video, social_post]
    prohibited_rewrites:
      - 保证不错过任何重要消息
      - 提前于市场发现牛股
    review_required: false
  - id: claim-finhot-source-evidence
    text: FinHot 不止聚合二手解读，还能按公司/关键词查公告、互动易、问询函等官方披露，先看源头证据再看热闹。
    product_ids: [finhot]
    support_feature_ids: [finhot-disclosure-lookup]
    allowed_channels: [longform, short_video, social_post]
    prohibited_rewrites:
      - 官方披露实时全覆盖
      - 用披露信息预测股价
    review_required: true
  - id: claim-finhot-local-first
    text: FinHot 是本地优先的桌面应用，数据存本地 SQLite，AI 能力 BYOK，自己的阅读数据自己掌控。
    product_ids: [finhot]
    support_feature_ids: [finhot-local-first]
    allowed_channels: [longform, social_post]
    prohibited_rewrites:
      - 绝对安全不可能泄露
    review_required: false
  - id: claim-finance-daily-review
    text: 金融 Agent 每天收盘后自动生成结构化复盘：市场强弱、板块信号、涨停连板、策略矩阵，一次跑完。
    product_ids: [finance_agent]
    support_feature_ids: [finance-daily-review]
    allowed_channels: [longform, short_video, social_post]
    prohibited_rewrites:
      - 复盘告诉你明天买什么
      - 跟着复盘操作就能赚钱
    review_required: true
  - id: claim-finance-theme-radar
    text: 输入一个新题材，Theme Radar 输出题材定义、产业链拆解、公司分层、证据强度和信号缺口，一张图看清题材结构。
    product_ids: [finance_agent]
    support_feature_ids: [finance-theme-radar]
    allowed_channels: [longform, short_video, social_post]
    prohibited_rewrites:
      - 雷达选出的公司就是龙头
      - 按分层买入稳赚
    review_required: true
  - id: claim-evidence-first-research
    text: 金融 Agent 不只总结观点，而是把每个判断拆成证据、反证和验证路径，结论带出处、可复盘、可证伪。
    product_ids: [finance_agent]
    support_feature_ids: [finance-evidence-graph, finance-perspective-lab]
    allowed_channels: [longform, short_video, social_post]
    prohibited_rewrites:
      - AI 会告诉你明天买什么
      - 自动提高收益率
    review_required: true
  - id: claim-combo-workflow
    text: FinHot 发现线索，金融 Agent 验证题材：从信息流到证据分层的完整研究工作流，一条链走完。
    product_ids: [finhot, finance_agent]
    support_feature_ids: [finhot-multi-source-feed, finance-theme-radar]
    allowed_channels: [longform, short_video, social_post]
    prohibited_rewrites:
      - 全自动投研无需人工判断
    review_required: true
