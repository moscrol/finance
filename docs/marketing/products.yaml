products:
  - id: finhot
    name: FinHot
    positioning: 本地优先的金融信息流阅读器，把 RSS、微博、雪球、微信、X 和官方披露源聚合成可打分、可摘要、可追踪的高信号阅读流
    primary_audience: [主观交易者, 财经内容创作者]
    secondary_audience: [AI 工具爱好者]
    repo: finhot
    public_boundary:
      can_say:
        - 多源聚合财经信息（RSS、微博、雪球、微信、X、自定义 watchlist）
        - AI 摘要、中译、质量打分
        - 主题阅读、聚类、时间线整理
        - 官方披露查新（公告、互动易、问询函，P0-P3 分级）
        - 本地优先（本地 SQLite、桌面应用、BYOK AI）
      cannot_say:
        - 保证提前发现牛股
        - 替代专业投顾
        - 保证信息全覆盖或零延迟
  - id: finance_agent
    name: Foresight
    positioning: 会校准你判断的 A 股个人研究工作台：把盘面数据、研报/公告证据、题材图谱和个人认知框架对齐，判断登记为可证伪点并被次日回检，方法论按历史成功率升格或证伪；结论带出处、可复盘、可证伪
    primary_audience: [主观交易者]
    secondary_audience: [财经内容创作者, AI 工具爱好者]
    repo: finance-workspace-private
    public_boundary:
      can_say:
        - 帮助整理盘面、题材和证据
        - 每日复盘（市场强弱、板块信号、涨停连板、策略矩阵）
        - Theme Radar 题材拆解与公司分层
        - 输出带出处、可复盘、可证伪的研究结论
        - 双盲验证与判断回灌
      cannot_say:
        - 自动下单或替你买卖
        - 保证收益或抓涨停
        - 提供确定性投资建议
        - 把 Foresight 说成能预测行情或预见涨跌（名字指「先见」，做的是校准；任何物料不得让 Foresight 单独出现而不带「不预测、只校准」的限定）
