name: workbench-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 三个叶子 job 并行：python / frontend / e2e 各自独立报红。
# 历史上单 job 串行 ruff→pytest→E2E，前一步 fail-fast 会把后面变成 skipped
# （看起来像「还没结论」），pytest 红的 26 天里 E2E 一次没跑（#337/#342）。
# #342 用 !cancelled() 治了步骤级掩红；本文件把它们拆成独立 job，
# GitHub Checks 也能分别钉死。聚合 job 仍叫 workbench-check，合并纪律和
# 将来的 required checks 不用改名。
jobs:
  python:
    # macOS：套件里有一批只在 macOS 上成立的用例（launchd / APFS clonefile / sandbox-exec 等），
    # ubuntu 上必红；全量约 18 分钟，原 15 分钟上限从未跑完（09-23～09-30 main 上 100 次 0 成功）。
    # 公开仓用 GitHub 托管 macOS runner 不计费；若转私有，macOS 分钟按约 10 倍计，届时重估。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tests/test_pi_review_repair.py 会起 node 子进程；版本对齐 test-environment.json 的 node_major。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Lint Python with Ruff
        if: ${{ !cancelled() }}
        run: python -m ruff check .

      - name: Test Python packages
        if: ${{ !cancelled() }}
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/pytest-junit.xml"

      # 失败清单写成 check annotation：日志与 artifact 走 blob 存储，部分受限环境
      # （云端 agent sandbox）下载不了，annotation 走 api.github.com 能读。只报告、不改判定。
      - name: Report pytest failures as annotations
        if: ${{ failure() }}
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          p = os.path.join(os.environ["RUNNER_TEMP"], "pytest-junit.xml")
          if not os.path.exists(p):
              print("::error title=pytest::no junit report (collection crash or timeout?)"); raise SystemExit
          esc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          prop = lambda s: esc(s).replace(":", "%3A").replace(",", "%2C")
          bad = []
          for tc in ET.parse(p).getroot().iter("testcase"):
              for kind in ("failure", "error"):
                  el = tc.find(kind)
                  if el is not None:
                      nid = f'{tc.get("classname", "")}::{tc.get("name", "")}'
                      detail = (el.get("message") or "") + "\n" + (el.text or "")
                      bad.append((kind, nid, detail))
          print(f"::error title=pytest {len(bad)} failed::" + esc("\n".join(f"{k} {n}" for k, n, _ in bad)[:60000]))
          # GitHub 每步每级最多 10 条：error 9 条 + warning 10 条 + notice 10 条给逐条详情
          for i, (k, n, d) in enumerate(bad[:29]):
              level = "error" if i < 9 else ("warning" if i < 19 else "notice")
              tail = d.strip()[-3500:]
              print(f"::{level} title={prop(n[-150:])}::" + esc(tail))

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install frontend dependencies
        working-directory: intelligence/webapp
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        if: ${{ !cancelled() }}
        working-directory: intelligence/webapp
        run: pnpm lint

      - name: Typecheck frontend
        if: ${{ !cancelled() }}
        working-directory: intelligence/webapp
        run: pnpm typecheck

      - name: Test frontend components
        if: ${{ !cancelled() }}
        working-directory: intelligence/webapp
        run: pnpm test

      - name: Build production frontend
        if: ${{ !cancelled() }}
        working-directory: intelligence/webapp
        run: pnpm build

      # The FastAPI app serves intelligence/api/static as committed.  A stale
      # build ships a backend whose UI entry points are missing, so the
      # committed assets must equal a fresh build of the same source.
      - name: Verify committed static assets match the source build
        if: ${{ !cancelled() }}
        run: |
          drift="$(git status --porcelain -- intelligence/api/static)"
          if [ -n "$drift" ]; then
            echo "::error::intelligence/api/static is stale; run 'pnpm build' in intelligence/webapp and commit the result."
            echo "$drift"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install frontend dependencies
        working-directory: intelligence/webapp
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: intelligence/webapp
        run: pnpm exec playwright install --with-deps chromium

      - name: Test Workbench end to end
        working-directory: intelligence/webapp
        env:
          WORKBENCH_PYTHON: python
        run: |
          pnpm test:e2e
          pnpm test:e2e:calendar

      - name: Test review evidence handoff end to end
        if: ${{ !cancelled() }}
        working-directory: intelligence/webapp
        env:
          WORKBENCH_PYTHON: python
        run: pnpm test:e2e:review-evidence

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: intelligence/webapp/test-results
          if-no-files-found: ignore
          retention-days: 7

  workbench-check:
    if: ${{ always() }}
    needs: [python, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require python, frontend, and e2e
        run: |
          python="${{ needs.python.result }}"
          frontend="${{ needs.frontend.result }}"
          e2e="${{ needs.e2e.result }}"
          echo "python=$python frontend=$frontend e2e=$e2e"
          test "$python" = success -a "$frontend" = success -a "$e2e" = success
