# 红线硬拦截：阻止提交密钥 / 大文件 / 缓存 / 虚拟环境 / 依赖等危险文件。
# 新机首次启用：  pip install pre-commit && pre-commit install
# 之后每次 git commit 自动检查；命中红线则提交失败。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key            # 内容里出现私钥 -> 拦截
      - id: check-added-large-files       # 新增大文件 -> 拦截
        args: ["--maxkb=5120"]
      - id: check-merge-conflict          # 残留冲突标记 -> 拦截
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff-check
        args: ["--config=ruff.toml"]
  - repo: local
    hooks:
      # 事实投递，不是风格检查：本仓 8 个 worktree 各在不同分支、宿主 python3 与
      # .venv-workbench 依赖完全不同。2026-08-05 两个 agent 在这两件事上合计出错 7 次，
      # 且没有一次被 AGENTS.md/CLAUDE.md 拦住——提醒的到达率不可靠，门禁是 100%。
      # always_run + verbose：无论改了什么文件都跑，且输出必须可见（否则等于没装）。
      - id: agent-workspace-facts
        name: "工作区事实：你在哪棵树、用哪个解释器"
        language: system
        entry: python3 scripts/check_agent_workspace_facts.py
        pass_filenames: false
        always_run: true
        verbose: true
      - id: layer-audit
        name: "层级审计"
        language: system
        entry: python3 scripts/layer_audit.py
        pass_filenames: false
        always_run: true
        verbose: true
      # 棘轮门禁：存量 51 处家目录字面量免检，只拦**新增**。
      # 判据刻意不是「是否合理」——测试目录里既有必须保留的脱敏夹具
      # （assert "/Users/a77" not in encoded），也有真实��径依赖
      # （.venv-workbench/bin/python），按目录或按语义判都必错。
      # 实测 0.70~0.83s（扫 778 个 .py），与 layer-audit 同量级，故可入链。
      # 宿主 python3 已实测可跑：本脚本只用 stdlib，与其他 hook 保持一致。
      - id: path-literals
        name: "路径字面量：不得新增写死的家目录"
        language: system
        entry: python3 scripts/check_path_literals.py
        pass_filenames: false
        always_run: true
        verbose: true
      - id: unread-fields
        name: "字段契约：不得新增「写了没人读」的字段"
        language: system
        entry: python3 scripts/check_unread_fields.py
        pass_filenames: false
        always_run: true
        verbose: true
      # 棘轮门禁：存量 25 张未注册表已带理由免检，只拦**新增**。
      # 抓的是「采集侧有 daily-full 天天跑、暴露侧没有对应的门」——表灌满了数、
      # 覆盖率审计全绿，而 agent 问到它答「查不到」。2026-08-13 和 08-25 各踩一次。
      # 判据取自 schema.sql（独立于 _DATASETS），否则「没注册的表」按定义是空集。
      # 只用 stdlib，宿主 python3 实测可跑，与上面几条保持一致；
      # 「空表不许注册」那条需要 DuckDB，db/ 是 gitignore 的，故此处自动跳过，
      # 由 pytest 侧（test_dataset_registration_audit.py）用 monkeypatch 复挂。
      - id: dataset-registration
        name: "dataset 注册：入库了的表 agent 要够得着"
        language: system
        entry: python3 scripts/audit_dataset_registration.py
        pass_filenames: false
        always_run: true
        verbose: true
      # 抓的是「声明了但生产装配够不着」——工具在测试注册表里跑得好好的，
      # 生产装配少接一根线，于是它在生产里从来没被调起过，而单元测试全绿。
      #
      # ⚠️ entry 与上面几条**不同**：必须用主树 venv 解释器的绝对路径。
      # 本脚本 import 生产模块（build_episode_registry），不是纯 stdlib，
      # 宿主 python3 跑不了。这与仓内其它绝对路径依赖是同一现实：
      # 新机没有该 venv 时本 hook 会挂，属预期。
      #
      # 实测 0.89~1.09s（3 次），与 path-literals 同量级，故可入链。
      # 注意别沿用早期记的 0.2s——那是初版恒真式的数：当时判据取自声明本身，
      # unreachable 恒空、永不报警，快是因为它什么也没验。
      - id: tool-reachability
        name: "工具可达性：声明了的工具生产装配必须够得着"
        language: system
        entry: /Users/a77/finance-workspace-private/.venv-workbench/bin/python scripts/audit_tool_reachability.py
        pass_filenames: false
        always_run: true
        verbose: true
      # 第 12 道（运行底座 P4 / 工单 #31 第 4 条）：docs/runtime/{events,tools,harness-seams}.md
      # 是从 DURABLE_EVENT_KINDS / _TOOL_CONTRACTS / ResearchHarness 签名生成的目录；改了源码
      # 不重生成，读目录的人（和 test_runtime_catalog）看到的就是上一版。pytest 侧早有保鲜钉，
      # 这里把它前移到提交时——门禁 100% 到达，提醒不是。与 tool-reachability 同理用 venv
      # 绝对路径：脚本 import 生产模块。只在改到源头或目录本身时跑（files 正则），实测 <1s。
      - id: runtime-catalog-fresh
        name: "运行时目录保鲜：events / tools / harness-seams 与源码一致"
        language: system
        entry: /Users/a77/finance-workspace-private/.venv-workbench/bin/python scripts/gen_runtime_catalog.py --check
        pass_filenames: false
        files: '^(docs/runtime/(events|tools|harness-seams)\.md|scripts/gen_runtime_catalog\.py|intelligence/.*\.py)$'
        verbose: true
      - id: block-forbidden-files
        name: "红线：禁止提交 密钥/大二进制/缓存/虚拟环境/依赖"
        language: fail
        entry: "红线命中：该文件不允许提交（.env*/密钥/大二进制/缓存/虚拟环境/依赖等）。如确需提交请人工确认并 git commit --no-verify。"
        # 文件后缀类：私钥/大二进制/编译缓存/日志；目录类：虚拟环境/依赖/各类缓存（dist/build 不拦，避免误伤部署）
        files: '(^|/)(\.env($|\..+)|.*\.pem$|.*\.key$|.*\.pdf$|.*\.zip$|.*\.duckdb$|.*\.db$|.*\.pyc$|.*\.log$|\.DS_Store$|(\.venv|venv|env|node_modules|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|\.ipynb_checkpoints|\.cache)/)'
        exclude: '\.env\.(example|sample|template)$'
