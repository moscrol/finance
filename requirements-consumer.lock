# 消费侧 agent（web 入口）的依赖锁 —— 由 scripts/dependency_closure.py 生成，勿手改。
#
# 为什么不是 pip freeze：本仓 venv 里 68 个包同时供 ingest 侧（CDP 抓取 / 飞书写回 /
# 复盘同步 / mootdx / akshare 批量取数）与消费侧使用。消费侧 agent 只**读**这些数据，
# 整体冻结会把 28 个用不到的抓取库锁进运行环境，且掩盖「哪些依赖真的构成 agent
# 运行面」这个事实。
#
# 闭环算法：从入口文件 AST 递归，遇仓内模块进去、stdlib 跳过、其余算第三方，
# 再按已安装元数据展开传递依赖（不含 extra）。**函数体内的懒加载一样计入**——
# openai_agents_runtime.py:130-132 的 httpx/openai/agents 都是懒加载，
# 顶层扫描（pipreqs 之类）会漏，锁文件就会少包，而缺失只在运行时某条
# fallback 路径被触发才暴露。
#
# 入口     intelligence/api/app.py（消费侧唯一入口：agent web；
#          feishu_bot / server.py / cli.py 均不在消费侧范围内）
